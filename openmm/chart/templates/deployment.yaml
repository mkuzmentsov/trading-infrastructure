apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "polymarket-btc-5m-bot.name" . }}
  labels:
    {{- include "polymarket-btc-5m-bot.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "polymarket-btc-5m-bot.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "polymarket-btc-5m-bot.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        checksum/script: {{ include (print $.Template.BasePath "/configmap-script.yaml") . | sha256sum }}
        {{- if .Files.Glob "files/model/*" }}
        checksum/model: {{ include (print $.Template.BasePath "/configmap-model.yaml") . | sha256sum }}
        {{- end }}
    spec:
      {{- if .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      {{- end }}
      containers:
        - name: polymarket-btc
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "-u", {{ printf "/app/scripts/%s" (.Values.bot.entrypoint | default "main.py") | quote }}]
          env:
            - name: PYTHONPATH
              value: /app/scripts
          envFrom:
            - secretRef:
                name: {{ include "polymarket-btc-5m-bot.name" . }}-secret
          volumeMounts:
            - name: script
              mountPath: /app/scripts
            - name: logs
              mountPath: /app/logs
            - name: model
              mountPath: /app/model
              readOnly: true
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        # Bot source is ConfigMap-injected at /app/scripts (deploy.sh syncs src/
        # into files/scripts/ before helm upgrade); the image only provides deps.
        - name: script
          configMap:
            name: {{ include "polymarket-btc-5m-bot.name" . }}-script
            items:
              {{- range $path, $_ := .Files.Glob "files/scripts/*.py" }}
              - key: {{ $path | trimPrefix "files/scripts/" | replace "/" "__" }}
                path: {{ $path | trimPrefix "files/scripts/" }}
              {{- end }}
              {{- range $path, $_ := .Files.Glob "files/scripts/**/*.py" }}
              - key: {{ $path | trimPrefix "files/scripts/" | replace "/" "__" }}
                path: {{ $path | trimPrefix "files/scripts/" }}
              {{- end }}
        - name: logs
        {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "polymarket-btc-5m-bot.name" . }}-pvc
        {{- else }}
          emptyDir: {}
        {{- end }}
        # The model ConfigMap is managed outside Helm (apply-model-configmap.sh)
        # so the Helm release Secret stays under the 1 MiB Kubernetes cap.
        # Optional: the maker_rebate paper bots don't ship any ML model.
        - name: model
          configMap:
            name: {{ include "polymarket-btc-5m-bot.name" . }}-model
            optional: true
