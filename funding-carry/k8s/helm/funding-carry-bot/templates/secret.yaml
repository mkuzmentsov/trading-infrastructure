apiVersion: v1
kind: Secret
metadata:
  name: {{ include "funding-carry-bot.name" . }}-secret
  labels:
    {{- include "funding-carry-bot.labels" . | nindent 4 }}
type: Opaque
stringData:
  # main.py reads --config /app/config/config.yaml; the Secret volume mounts
  # this key as that file. Credentials live ONLY in the per-bot overlay
  # (helm/bots/<name>.yaml), which is gitignored.
  config.yaml: |
{{ .Values.botConfig | toYaml | indent 4 }}
