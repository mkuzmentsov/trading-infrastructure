apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "funding-carry-bot.name" . }}-script
  labels:
    {{- include "funding-carry-bot.labels" . | nindent 4 }}
data:
  {{- range $path, $content := .Files.Glob "files/bot/*.py" }}
  {{ $path | trimPrefix "files/bot/" }}: |
{{ $content | toString | indent 4 }}
  {{- end }}
