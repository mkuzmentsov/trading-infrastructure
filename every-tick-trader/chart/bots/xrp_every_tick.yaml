# xrp-every-tick-trader — maker-rebate PAPER quoting on the xrp 5m up/down market.
# Install: helm upgrade --install xrp-every-tick-trader ../ -f bots/xrp_every_tick.yaml
botName: xrp-every-tick-trader

bot:
  coin: "xrp"
  strategyName: "maker_rebate"
  paperMode: "true"
  quoteMode: "bracket"       # predict side, one entry fill, TP/SL bracket (one_sided/two_sided kept)
  quoteSide: "cheaper"       # only used by quoteMode=one_sided
  entryPriceCap: "0.48"      # flat resting bid — fills if the flow comes to us, otherwise skip the bar
  takeProfitPrice: "0.99"    # bracket: resting maker SELL
  stopLossPrice: "0"        # disabled 2026-07-02: 7/7 stopped positions recovered to win (PLAN.md backlog analysis)      # bracket: taker SELL when best bid <= this
  maxFillsPerBar: "1"        # bracket: one entry fill per bar, no refill
  dryRun: "true"                # belt-and-braces — taker code paths stay simulated too
  # loopIntervalSecs is the BAR LENGTH (5m fallback for boundary math), NOT the
  # tick rate. The loop tick is evalIntervalMs: 5s so quotes reprice intra-bar
  # (the old 300s/one-shot cadence only made sense for the taker bot).
  loopIntervalSecs: "300"
  evalIntervalMs: "5000"
  # Coin-consistent spot feeds (settlement-aligned RTDS + Binance lead feed).
  binanceWsUrl: "wss://stream.binance.com:9443/ws/xrpusdt@aggTrade"
  polymarketRtdsSymbol: "xrp/usd"
  # Maker knobs (defaults restated for greppability).
  quoteHalfSpread: "0.02"
  quoteFloor: "0.45"
  quoteCeil: "0.70"
  quoteSize: "10"
  quoteNotionalUsd: "5"    # USD entry budget (bracket) — start 5, raise to 10 when ready
  quoteCutoffSecs: "0"
  quoteWarmupSecs: "0"
  minPairEdge: "0.01"
  repriceTicks: "0.01"
  repriceZ: "1.5"
  maxInventoryShares: "50"
  makerFeeRate: "0.07"
