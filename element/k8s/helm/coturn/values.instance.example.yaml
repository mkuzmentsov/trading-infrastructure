# Public IP of the existing Traefik LoadBalancer:
#   kubectl get svc traefik -n kube-system
externalIp: "1.2.3.4"

# Generate with: python3 -c "import secrets; print(secrets.token_hex(32))"
# Must match turn.sharedSecret in synapse values.instance.yaml
sharedSecret: "CHANGE_ME"

# Must match serverName in synapse values.instance.yaml
realm: "matrix.example.com"

service:
  type: LoadBalancer
  annotations:
    # Attach to the existing Traefik LB by ID (prevents creating a second LB):
    #   kubectl get svc traefik -n kube-system -o jsonpath='{.metadata.annotations}'
    load-balancer.hetzner.cloud/id: "HETZNER_LB_ID"
    load-balancer.hetzner.cloud/location: "nbg1"
    load-balancer.hetzner.cloud/name: "k8s-ingress-lb"
    load-balancer.hetzner.cloud/type: "lb11"
