apiVersion: v1
kind: Secret
metadata:
  name: {{ include "coturn.name" . }}-config
  labels:
    {{- include "coturn.labels" . | nindent 4 }}
type: Opaque
stringData:
  turnserver.conf: |
    listening-port=3478

    # Public IP of the Hetzner LB — required for NAT traversal
    {{- if .Values.externalIp }}
    external-ip={{ .Values.externalIp }}
    {{- end }}

    realm={{ .Values.realm }}

    # HMAC-based ephemeral credentials (shared with Synapse)
    use-auth-secret
    static-auth-secret={{ .Values.sharedSecret }}

    # Security: block relaying to private/loopback ranges
    no-multicast-peers
    denied-peer-ip=0.0.0.0-0.255.255.255
    denied-peer-ip=10.0.0.0-10.255.255.255
    denied-peer-ip=100.64.0.0-100.127.255.255
    denied-peer-ip=127.0.0.0-127.255.255.255
    denied-peer-ip=169.254.0.0-169.254.255.255
    denied-peer-ip=172.16.0.0-172.31.255.255
    denied-peer-ip=192.0.0.0-192.0.0.255
    denied-peer-ip=192.168.0.0-192.168.255.255
    denied-peer-ip=198.18.0.0-198.19.255.255
    denied-peer-ip=198.51.100.0-198.51.100.255
    denied-peer-ip=203.0.113.0-203.0.113.255
    denied-peer-ip=240.0.0.0-255.255.255.255

    log-file=stdout
    no-stdout-log
    syslog
