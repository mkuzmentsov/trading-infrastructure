apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: {{ include "coturn.name" . }}-turn
  labels:
    {{- include "coturn.labels" . | nindent 4 }}
spec:
  entryPoints:
    - turn
  routes:
    - match: HostSNI(`*`)
      services:
        - name: {{ include "coturn.name" . }}
          port: 3478
