apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "livekit.name" . }}
  labels:
    {{- include "livekit.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "livekit.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "livekit.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      enableServiceLinks: false
      containers:
        - name: livekit
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --config
            - /etc/livekit/livekit.yaml
          ports:
            - name: http
              containerPort: 7880
              protocol: TCP
            - name: rtc-tcp
              containerPort: 7881
              protocol: TCP
            - name: turns
              containerPort: 5349
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /etc/livekit/livekit.yaml
              subPath: livekit.yaml
            - name: tls
              mountPath: /etc/livekit/tls
              readOnly: true
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "livekit.name" . }}-config
            items:
              - key: livekit.yaml
                path: livekit.yaml
        - name: tls
          secret:
            secretName: {{ .Values.ingress.tls.secretName }}
