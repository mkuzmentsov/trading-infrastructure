apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "livekit.name" . }}-config
  labels:
    {{- include "livekit.labels" . | nindent 4 }}
data:
  livekit.yaml: |
    port: 7880

    rtc:
      tcp_port: 7881
      # UDP is not available on Hetzner LB — disabled
      udp_port: 0
      use_external_ip: false
      # Hardcoded Hetzner LB public IP — auto-detect returns the pod/node IP, not the LB IP
      node_ip: {{ .Values.externalIp | quote }}

    # Built-in TURN server (TURNS/TLS on 5349) — enables Android clients which cannot
    # generate TCP ICE candidates to connect via TURN relay over TCP.
    turn:
      enabled: true
      domain: {{ .Values.ingress.host | quote }}
      cert_file: /etc/livekit/tls/tls.crt
      key_file: /etc/livekit/tls/tls.key
      tls_port: 5349
      udp_port: 0

    keys:
      {{ .Values.apiKey }}: {{ .Values.apiSecret }}

    logging:
      level: info

    prometheus_port: 0
