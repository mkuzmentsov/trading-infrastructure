image:
  repository: livekit/livekit-server
  tag: latest
  pullPolicy: IfNotPresent

# Public IP of the Hetzner LB — hardcoded because auto-detect fails behind LB.
externalIp: ""

# LiveKit API credentials — generate with:
#   python3 -c "import secrets; print(secrets.token_hex(16))"  # key name
#   python3 -c "import secrets; print(secrets.token_hex(32))"  # secret
# Must match lk-jwt-service values: livekitKey / livekitSecret
apiKey: ""
apiSecret: ""

ingress:
  enabled: true
  className: traefik
  host: "livekit.matrix.example.com"
  tls:
    enabled: true
    certManager: "letsencrypt-prod"
    secretName: "livekit-tls"

service:
  type: ClusterIP

resources:
  requests:
    memory: 128Mi
    cpu: 100m
  limits:
    memory: 512Mi
    cpu: 500m
