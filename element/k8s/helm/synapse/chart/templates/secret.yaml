apiVersion: v1
kind: Secret
metadata:
  name: {{ include "synapse.name" . }}-config
  labels:
    {{- include "synapse.labels" . | nindent 4 }}
type: Opaque
stringData:
  homeserver.yaml: |
    server_name: {{ .Values.serverName | quote }}
    pid_file: /data/homeserver.pid

    listeners:
      - port: 8008
        tls: false
        type: http
        x_forwarded: true
        resources:
          - names: [client, federation]
            compress: false

    database:
      name: sqlite3
      args:
        database: /data/homeserver.db

    log_config: "/data/log.config"
    media_store_path: /data/media_store
    signing_key_path: "/data/signing.key"

    registration_shared_secret: {{ .Values.synapse.registrationSharedSecret | quote }}
    macaroon_secret_key: {{ .Values.synapse.macaroonSecretKey | quote }}
    form_secret: {{ .Values.synapse.formSecret | quote }}

    report_stats: {{ .Values.synapse.reportStats }}

    # Open registration is disabled — users are created via register_new_matrix_user
    enable_registration: false
    enable_registration_without_verification: false

    trusted_key_servers:
      - server_name: "matrix.org"
    suppress_key_server_warning: true

    {{- if .Values.turn.enabled }}
    turn_uris:
      - "turn:{{ .Values.turn.externalIp }}:3478?transport=tcp"
    turn_shared_secret: {{ .Values.turn.sharedSecret | quote }}
    turn_user_lifetime: 86400000
    turn_allow_guests: false
    {{- end }}

  log.config: |
    version: 1
    formatters:
      precise:
        format: '%(asctime)s - %(name)s - %(lineno)d - %(levelname)s - %(request)s - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: precise
    loggers:
      synapse.storage.SQL:
        level: WARNING
    root:
      level: INFO
      handlers: [console]
    disable_existing_loggers: false
