apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "synapse.name" . }}
  labels:
    {{- include "synapse.labels" . | nindent 4 }}
spec:
  replicas: 1
  # Recreate ensures the old pod stops before the new one starts (SQLite cannot be shared)
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "synapse.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "synapse.selectorLabels" . | nindent 8 }}
      annotations:
        # Trigger pod restart when config changes
        checksum/config: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
    spec:
      securityContext:
        # Synapse Docker image runs as uid/gid 991
        runAsUser: 991
        runAsGroup: 991
        fsGroup: 991
      containers:
        - name: synapse
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8008
              protocol: TCP
          volumeMounts:
            # PVC holds: signing.key, homeserver.db, media_store
            - name: data
              mountPath: /data
            # homeserver.yaml and log.config overlaid from Secret (subPath keeps PVC intact)
            - name: config
              mountPath: /data/homeserver.yaml
              subPath: homeserver.yaml
            - name: config
              mountPath: /data/log.config
              subPath: log.config
          readinessProbe:
            httpGet:
              path: /_matrix/client/versions
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /_matrix/client/versions
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "synapse.name" . }}-pvc
        - name: config
          secret:
            secretName: {{ include "synapse.name" . }}-config
            items:
              - key: homeserver.yaml
                path: homeserver.yaml
              - key: log.config
                path: log.config
