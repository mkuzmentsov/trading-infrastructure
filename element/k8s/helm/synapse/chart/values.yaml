# The Matrix server name — used in all MXIDs (@user:your-domain.com).
# Must match your public DNS hostname. Cannot be changed after first run.
serverName: "matrix.example.com"

image:
  repository: matrixdotorg/synapse
  tag: latest
  pullPolicy: IfNotPresent

synapse:
  reportStats: false
  # Generate all three secrets with:
  #   python3 -c "import secrets; print(secrets.token_hex(32))"
  # Used by register_new_matrix_user to create users without open registration.
  registrationSharedSecret: ""
  macaroonSecretKey: ""
  formSecret: ""

ingress:
  enabled: true
  className: traefik
  # Must match serverName above
  host: "matrix.skarbfolio.app"
  tls:
    enabled: false
    # Set to your cert-manager ClusterIssuer name to auto-provision TLS, e.g. letsencrypt-prod
    certManager: ""
    secretName: "synapse-tls"

turn:
  enabled: false
  # Coturn LoadBalancer IP — fill in after deploying coturn:
  #   kubectl get svc coturn -n element  (copy EXTERNAL-IP)
  externalIp: ""
  # Must match sharedSecret in coturn values.yaml
  # Generate with: python3 -c "import secrets; print(secrets.token_hex(32))"
  sharedSecret: ""

livekit:
  enabled: false
  # Public HTTPS URL of lk-jwt-service — must match lk-jwt-service ingress host
  jwtServiceUrl: "https://lk-jwt.matrix.example.com"

persistence:
  # Always enabled — Synapse stores signing key, SQLite DB and media on disk.
  size: 10Gi
  # Leave empty to use the cluster default (local-path on k3s)
  storageClass: ""

resources:
  requests:
    memory: 512Mi
    cpu: 200m
  limits:
    memory: 1Gi
    cpu: 500m
