image:
  repository: ghcr.io/element-hq/lk-jwt-service
  tag: latest
  pullPolicy: IfNotPresent

# Public wss:// URL of LiveKit server — used in tokens issued to clients.
# Must match the livekit ingress host with wss:// scheme.
livekitHost: "wss://livekit.matrix.example.com"

# Must match livekit values: apiKey / apiSecret
livekitKey: ""
livekitSecret: ""

ingress:
  enabled: true
  className: traefik
  host: "lk-jwt.matrix.example.com"
  tls:
    enabled: true
    certManager: "letsencrypt-prod"
    secretName: "lk-jwt-tls"

service:
  type: ClusterIP

resources:
  requests:
    memory: 32Mi
    cpu: 10m
  limits:
    memory: 128Mi
    cpu: 100m
