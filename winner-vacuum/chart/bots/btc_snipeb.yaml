# btc-snipeb — settlement sniper, BOOK-confirmed winner signal. LIVE 5sh/deal.
#
# Runs in PARALLEL with btc-snipe (Binance-lead signal) on identical bars so
# the two signals can be compared out-of-sample. Rationale from 27-30 Jul: on
# the 5 tie bars that carried harvestable winner liquidity, the Binance lead
# was wrong on 4 (capturing 23% of value) while the post-close book was right
# on all 5 by +2s and 3 of 5 by +0.5s.
#
# Trade-off being measured: waiting 600ms for the book to reprice burns part of
# the liquidity window, which ran -0.03..1.28s after close on those bars.
# snipeBookMinEdge 0.20 = refuse to fire while the two bids are within 20c of
# each other (book not yet decisive) -> SNIPE_SKIP reason=book_unclear.
#
# Same risk envelope as btc-snipe: FAK at limit 0.05, so max loss $0.25/deal,
# $20 daily halt. Both bots live => at most $0.50/bar combined.
botName: btc-snipeb
bot:
  entrypoint: "snipe.py"
  coin: "btc"
  paperMode: "false"
  dryRun: "false"
  liveTrading: "true"
  loopIntervalSecs: "300"
  trainingEventLogPath: "/app/logs/logs-training-events.jsonl"
  postCloseGraceSecs: "20"
  snipeCap: "0.05"
  snipeShares: "5"
  snipeLockSrc: "book"
  snipeBookWaitMs: "600"
  snipeBookMinEdge: "0.20"
  snipeMinLeadBps: "0"
  snipeMaxSpotAge: "10"
  snipeMaxDailyLoss: "20"
  favOrderType: "fak"
  binanceWsUrl: "wss://stream.binance.com:9443/ws/btcusdt@aggTrade"
  polymarketRtdsSymbol: "btc/usd"
