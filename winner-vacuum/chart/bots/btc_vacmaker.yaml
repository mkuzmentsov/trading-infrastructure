# btc-vacmaker LIVE — TWAP-taker lane (VACMAKER.md; wallet 0xefdf6abc…).
# ONE strategy, per-coin operating point picked by harvest (docs/vacmaker-
# offline-notes.md). btc = mid cell: eval_tl 25s, coverage ~0.63 at entry
# (floor 0.55; rule: floor < (62-tl)/59 or the bot never fires), band
# 0.55-0.98. btc's book is the most efficient of the 7 — its winner-ask is
# almost never inside the band when the signal clears the gate, so ~0
# bets/day is EXPECTED behavior, not a fault (0 orders all of 08-15 with
# 60+ evals). Kept live as a free option on volatile days.
# This file mirrors deployed helm values.
botName: btc-vacmaker

bot:
  coin: btc
  dryRun: "false"
  entrypoint: twapedge.py
  liveMaxDailyLossUsd: "15"
  liveMaxOrderUsd: "12"
  liveQuoteWarmupSecs: "0"
  liveReconcileSecs: "30"
  liveTrading: "true"
  loopIntervalSecs: "300"
  paperMode: "false"
  pmTeEvalTl: "28"
  pmTeLiveInflightUsd: "30"
  pmTeLiveSize: "13"
  pmTeLockLiveUsd: "0"
  pmTeMakerCancelBps: "1.0"
  pmTeMakerRestPx: "0"
  pmTeMaxAsk: "0.98"
  pmTeMinAsk: "0.55"
  pmTeMinCoverage: "0.5"
  pmTeWhaleStart: "30"
  # 2026-08-22 (notes §33/§37): the vol CONDITION is removed, the DELAY stays.
  # Measured 08-18+ venue truth: tl 21-30 = 60% of our clips and -$74.51 at
  # 95.6% win, while tl<=20 runs 98.3-100% win / +3.29..+12.68% ROI. Ambient
  # vol separates accuracy by ~0 (margin separates by up to 14pp), so gating
  # the delay on vol was gating on noise. 0.01 = always-on; it is a DELAY not
  # a skip, so the clip still fires in the tl<=20 lane. Revert: set back to 10.
  pmTeWhaleVolDelayVol: "0.01"
  pmTeWhaleLadderUsd: "24"
  pmTeSize: "8"
  pmTeSnipeCap: "0.99"
  pmTeSnipeLiveUsd: "12"
  # 2026-08-27 SNIPE REST PILOT (btc only): the taker snipe went 0/205 for
  # the whole gate era — every FAK died 'no orders found to match' (no asks
  # <= cap exist post-close; the venue error is swallowed inside
  # post_signed_buy, so events showed order=null). The real post-close flow
  # is winner-holders DUMPING into resting bids: btc tape 08-27 shows
  # ~$103k/8h of winner shares printing at 0.99/0.999 into maker bids
  # (~$1.4k/day of spread, fee-free for makers). Rest mode places a GTC
  # post-only bid at snipeCap on the KNOWN winner at ~T+2s instead.
  # Revert: drop pmTeSnipeRest.
  pmTeSnipeRest: "1"
  pmTeSnipeSize: "12"
  pmTeSnipeWindowS: "90"
  pmTeThreshBps: "0.5"
  pmTeTieMaxAsk: "0"
  pmTeTwapWindow: "60"
  polymarketRtdsSymbol: btc/usd
  prediscoveryLeadSecs: "30"
  quoteNotionalUsd: "5"
  trainingEventLogPath: /app/logs/logs-training-events.jsonl

persistence:
  enabled: true
  size: 2Gi
