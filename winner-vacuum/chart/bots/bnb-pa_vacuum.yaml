# bnb-pa — complementary-pair arbitrage (PAPER first).
#
# Buys UP+DOWN together whenever their asks sum below $1.00 net of fees: one
# of them always settles at $1.00, so the pair locks the difference with NO
# directional exposure and no prediction. The only real hazard is leg risk,
# removed by sizing both legs to the smaller depth and unwinding any excess.
#
# Backtest (mrec 4d, 200ms latency, 0.5c min edge, fees on both legs):
# ~$13.55/day across 6 coins with ZERO legged positions. Latency is decisive —
# bnb was chosen because its crossings persist long enough to reach.
botName: bnb-pa-vacuum

bot:
  entrypoint: "pairarb.py"
  coin: "bnb"
  paperMode: "true"
  dryRun: "true"
  liveTrading: "false"
  loopIntervalSecs: "300"
  trainingEventLogPath: "/app/logs/logs-training-events.jsonl"
  postCloseGraceSecs: "20"
  paMinEdge: "0.005"
  paNotional: "25"
  paCooldown: "30"
  paMaxDailyLoss: "20"
  favOrderType: "fak"
  liveMaxOrderUsd: "25"
  liveMaxDailyLossUsd: "20"
  binanceWsUrl: "wss://stream.binance.com:9443/ws/bnbusdt@aggTrade"
  polymarketRtdsSymbol: "bnb/usd"
