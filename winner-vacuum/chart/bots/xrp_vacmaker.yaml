# xrp-vacmaker LIVE — TWAP-taker lane (VACMAKER.md; wallet 0xefdf6abc…).
# ONE strategy, per-coin operating point picked by harvest (docs/vacmaker-
# offline-notes.md). xrp = late "whale cell": eval_tl 14s, coverage ~0.81
# at entry (floor 0.7; rule: floor < (62-tl)/59 or the bot never fires),
# band 0.55-0.99. At tl20 xrp had ZERO buyable supply all day; the tl50
# probe (xrp2) went 8/8 +$2.16 — eth-like cell is the fallback candidate if
# T-14 stays supply-starved. Renamed from xrp3 2026-08-15 (user: no version
# suffixes); prior xrp3 events → data/xrp3-final-20260815.jsonl.
# ⚠ deploy.sh live applies crypto.secret.yaml LAST — its caps override the
# ones below (currently $5/order $50/day there; unification pending).
# 2026-08-29 SIZING TIERS (user-approved; notes S55): raise greens btc/eth/hype to $24 clip/$48 ladder/$60 inflight (halt $15 unchanged = doubled upside, same floor); bnb holds $12 (green 6/6 post-fix); starve sol/doge (xrp PROMOTED to $24 tier 08-30 user order) to $5/$10/$15 with halt $7 (floor scaled with upside). Overlay no longer carries liveMaxOrderUsd/liveMaxDailyLossUsd.
botName: xrp-vacmaker

bot:
  coin: xrp
  dryRun: "false"
  entrypoint: twapedge.py
  liveMaxDailyLossUsd: "30"
  # 08-30 user: halts pause 1h then resume w/ fresh budget (episodes; 0=day)
  liveHaltCooldownS: "3600"
  liveMaxOrderUsd: "24"
  liveQuoteWarmupSecs: "0"
  liveReconcileSecs: "30"
  liveTrading: "true"
  loopIntervalSecs: "300"
  paperMode: "false"
  pmTeEvalTl: "28"
  pmTeLiveInflightUsd: "60"
  pmTeLiveSize: "26"
  pmTeLockLiveUsd: "0"
  pmTeMakerCancelBps: "1.0"
  pmTeMakerRestPx: "0"
  pmTeMaxAsk: "0.99"
  pmTeMinAsk: "0.55"
  pmTeMinCoverage: "0.5"
  pmTeWhaleStart: "30"
  pmTeWhaleScanS: "0.15"
  # 08-30 §58 mid-band first-clip skip (eth exempt - band +$60 there)
  pmTeFirstSkipLo: "0.90"
  pmTeFirstSkipHi: "0.98"
  # 08-30 §59 PILOT (user "try on xrp"): toxic-fill ladder brake @5%
  # (era net +$12.28) + risk-state persistence across restarts.
  pmTeToxicBrake: "0.05"
  pmTeRiskPersist: "1"
  pmTeWhaleCooldownS: "0.5"
  pmTeDislocLadderUsd: "24"
  # 2026-08-22 (notes §33/§37): the vol CONDITION is removed, the DELAY stays.
  # Measured 08-18+ venue truth: tl 21-30 = 60% of our clips and -$74.51 at
  # 95.6% win, while tl<=20 runs 98.3-100% win / +3.29..+12.68% ROI. Ambient
  # vol separates accuracy by ~0 (margin separates by up to 14pp), so gating
  # the delay on vol was gating on noise. 0.01 = always-on; it is a DELAY not
  # a skip, so the clip still fires in the tl<=20 lane. Revert: set back to 10.
  pmTeWhaleVolDelayVol: "0.01"
  pmTeWhaleLadderUsd: "48"
  pmTeSize: "8"
  pmTeSnipeCap: "0.99"
  pmTeSnipeLiveUsd: "12"
  pmTeSnipeSize: "12"
  pmTeSnipeWindowS: "90"
  pmTeThreshBps: "0.5"
  pmTeTieMaxAsk: "0"
  pmTeTwapWindow: "60"
  polymarketRtdsSymbol: xrp/usd
  prediscoveryLeadSecs: "30"
  quoteNotionalUsd: "5"
  trainingEventLogPath: /app/logs/logs-training-events.jsonl

persistence:
  enabled: true
  size: 2Gi
