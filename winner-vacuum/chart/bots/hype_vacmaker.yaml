# hype-vacmaker LIVE — TWAP-taker lane (VACMAKER.md; wallet 0xefdf6abc…).
# ONE strategy, per-coin operating point picked by harvest (docs/vacmaker-
# offline-notes.md). hype = late "whale cell": eval_tl 14s, coverage ~0.81
# at entry (floor 0.7; rule: floor < (62-tl)/59 or the bot never fires),
# band 0.55-0.99. hype has the WORST estimate accuracy of the 7 coins
# (87.6% offline) — the tl40 cell took the fleet's first two losses on
# coverage-0.33 partial reads (2026-08-15, −$11.86) and was REMOVED; T-14
# high-coverage is the only hype cell allowed. First whale-cell trade won
# (5sh@0.98 +$0.10). Renamed from hype3 (user: no version suffixes); prior
# events → data/hype3-final-20260815.jsonl, tl40 history →
# data/hype-tl40-final-20260815.jsonl.
# ⚠ deploy.sh live applies crypto.secret.yaml LAST — its caps override the
# ones below (currently $5/order $50/day there; unification pending).
# 2026-08-29 SIZING TIERS (user-approved; notes S55): raise greens btc/eth/hype to $24 clip/$48 ladder/$60 inflight (halt $30 = same 2-losses-and-out policy per dollar as the proven $12/$15 era); bnb holds $12 (green 6/6 post-fix); starve sol/doge/xrp to $5/$10/$15 with halt $7 (floor scaled with upside). Overlay no longer carries liveMaxOrderUsd/liveMaxDailyLossUsd.
botName: hype-vacmaker

bot:
  coin: hype
  dryRun: "false"
  entrypoint: twapedge.py
  liveMaxDailyLossUsd: "30"
  # 08-30 user: halts pause 1h then resume w/ fresh budget (episodes; 0=day)
  liveHaltCooldownS: "3600"
  liveMaxOrderUsd: "24"
  liveQuoteWarmupSecs: "0"
  liveReconcileSecs: "30"
  liveTrading: "true"
  loopIntervalSecs: "300"
  paperMode: "false"
  pmTeEvalTl: "28"
  pmTeLiveInflightUsd: "60"
  pmTeLiveSize: "26"
  pmTeLockLiveUsd: "0"
  pmTeMakerCancelBps: "1.0"
  pmTeMakerRestPx: "0"
  pmTeMaxAsk: "0.99"
  pmTeMinAsk: "0.55"
  pmTeMinCoverage: "0.5"
  pmTeWhaleStart: "30"
  # 08-30 disloc fleet-wide (user go; era top-15 bars: cheap entries <=0.85
  # made $3.55/bar vs $0.28 for >0.95; #1 bar = btc 0.19 -> +$33.76):
  # separate $24/bar budget for <=0.85 fills + 0.15s dislocation scan.
  pmTeWhaleScanS: "0.15"
  # 08-30 §58 mid-band first-clip skip (eth exempt - band +$60 there)
  pmTeFirstSkipLo: "0.90"
  pmTeFirstSkipHi: "0.98"
  pmTeWhaleCooldownS: "0.5"
  pmTeDislocLadderUsd: "24"
  # 2026-08-22 (notes §33/§37): the vol CONDITION is removed, the DELAY stays.
  # Measured 08-18+ venue truth: tl 21-30 = 60% of our clips and -$74.51 at
  # 95.6% win, while tl<=20 runs 98.3-100% win / +3.29..+12.68% ROI. Ambient
  # vol separates accuracy by ~0 (margin separates by up to 14pp), so gating
  # the delay on vol was gating on noise. 0.01 = always-on; it is a DELAY not
  # a skip, so the clip still fires in the tl<=20 lane. Revert: set back to 10.
  pmTeWhaleVolDelayVol: "0.01"
  pmTeWhaleLadderUsd: "48"
  pmTeSize: "8"
  pmTeSnipeCap: "0.99"
  pmTeSnipeLiveUsd: "12"
  pmTeSnipeSize: "12"
  pmTeSnipeWindowS: "90"
  pmTeThreshBps: "0.5"
  pmTeTieMaxAsk: "0"
  pmTeTwapWindow: "60"
  polymarketRtdsSymbol: hype/usd
  prediscoveryLeadSecs: "30"
  quoteNotionalUsd: "5"
  trainingEventLogPath: /app/logs/logs-training-events.jsonl

persistence:
  enabled: true
  size: 2Gi
