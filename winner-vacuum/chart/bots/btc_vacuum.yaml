# btc-vacuum — POST-CLOSE 99c winner vacuum. Locks the winner at bar-close
# (spot vs open, |lead|>=8bps) and rests ONE presigned GTC buy at 0.99 on the
# winning token for the first ~20s of the resolution delay; sellers dumping
# the winner at 0.955-0.999 to free capital fill us; redeem at $1.00.
# Validated source: wallet 0xA7614974 (172 bars, 100% WR); tape supply ~$8.5/bar.
# LIVE deploy (real money) via ./deploy.sh btc live — sizing confirmed by user.
botName: btc-vacuum

bot:
  entrypoint: "vacuum.py"
  coin: "btc"
  paperMode: "true"
  dryRun: "true"
  liveTrading: "false"
  loopIntervalSecs: "300"
  trainingEventLogPath: "/app/logs/logs-training-events.jsonl"
  postCloseGraceSecs: "50"
  snipeCap: "0.99"
  snipeFireMaxSecs: "45"
  # 2026-07-31: user set size to $550/deal (555sh at 0.99), up from $30.
  # Note the arithmetic this commits to: +1c/share on a win, -99c/share on a
  # loss, so ONE mislock is -$544 and breakeven needs a 99% win rate. The live
  # record 25-30 Jul is 118W/4L = 96.7% and -$192.35 cumulative at $30 sizing.
  # snipeMaxDailyLoss stays 35 deliberately: at this size any single loss blows
  # through it, which halts the bot for the rest of the UTC day -- one bad
  # trade per day is the cap, and that is the only real protection left.
  snipeNotional: "550"
  snipeMinLeadBps: "3"
  snipeMaxDailyLoss: "35"
  vacPreLeadBps: "5"
  vacEarlyLeadBps: "8"
  vacEarlyPlaceSecs: "45"
  vacPrePlaceSecs: "2.0"
  vacPreCancelBps: "2.0"
  vacFinePx: "0.995"
  favOrderType: "gtc"
  liveMaxOrderUsd: "25"
  liveMaxDailyLossUsd: "35"
  binanceWsUrl: "wss://stream.binance.com:9443/ws/btcusdt@aggTrade"
  polymarketRtdsSymbol: "btc/usd"
