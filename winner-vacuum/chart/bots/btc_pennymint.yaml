# btc-pennymint — MINT + dual 99c asks + matched 2c flip (user spec 2026-08-02).
# Per bar (always cur+2, never the in-progress bar): splitPosition $5 via the
# Safe/relayer -> 5 UP + 5 DOWN; rest GTC sells at 0.99 on both pre-open; on n
# shares filling at 99c, cancel the complement's 99c ask and sell n at 0.02
# (matched size — the round-4 backtest shape, rebate_arb/SLOW.md). Worst case
# -1c/share/bar; daily halt $5. ⚠ at $5 the 2c leg is $0.10 notional — if the
# venue's $1 min applies to sells it gets rejected; the rejection is itself a
# probe measurement (PF_LO_REJ) and the bot rides instead.
botName: btc-pennymint

bot:
  entrypoint: "pennymint.py"
  coin: "btc"
  paperMode: "true"
  dryRun: "true"
  liveTrading: "false"
  loopIntervalSecs: "300"
  trainingEventLogPath: "/app/logs/logs-training-events.jsonl"
  pmAheadBars: "2"
  pmMintUsd: "5"
  pmHiPx: "0.99"
  pmLoPx: "0.02"
  pmMaxDailyLoss: "5"
  liveMaxOrderUsd: "6"
  liveMaxDailyLossUsd: "5"
  # rpc.ankr.com (the config default) now 401s without an API key — the mint
  # and ERC1155 balance checks need a working RPC.
  polygonRpcUrl: "https://polygon-bor-rpc.publicnode.com"
  binanceWsUrl: "wss://stream.binance.com:9443/ws/btcusdt@bookTicker"
  polymarketRtdsSymbol: "btc/usd"

persistence:
  enabled: true
  size: 2Gi
