# eth-mintsalvage (clone of btc, $100 — scaled with btc after the probe) — MINT the pair via the collateral adapter, HOLD the winner
# to redemption (never sell it — keep the full $1.00), SALVAGE the loser at 1c
# in the final 45s, gated on |Binance lead| >= 5bps with a 2bps decay/flip
# watchdog (the vacuum's zero-flip thresholds). Knife-edge bars sell nothing:
# hold both to redemption = breakeven by construction. User spec 2026-08-02.
# EV/bar = +1c/share x P(1c ask fills); open venue question: 5sh @ 1c =
# $0.05 notional vs the $1 min that rejected cheap BUYS -> PF_SALV_REJ logs it.
botName: eth-mintsalvage

bot:
  entrypoint: "mintsalvage.py"
  coin: "eth"
  paperMode: "true"
  dryRun: "true"
  liveTrading: "false"
  loopIntervalSecs: "300"
  trainingEventLogPath: "/app/logs/logs-training-events.jsonl"
  pmMintUsd: "50"
  pmZTiers: "15:2.0,45:2.5"
  pmRisk: "1.25"
  pmSigFloor: "0.6"
  pmMintMode: "gated"
  pmMintGateBps: "4"
  pmMintGateTl: "52"
  pmMintLeadSecs: "40"
  pmGasCapGwei: "700"
  pmLeadFloorBps: "10"
  pmTrajWindowSecs: "10"
  pmTrajMinDeltaBps: "-3"
  pmMaxDailyLoss: "120"
  liveMaxOrderUsd: "6"
  liveMaxDailyLossUsd: "5"
  polygonRpcUrl: "https://polygon-bor-rpc.publicnode.com"
  binanceWsUrl: "wss://stream.binance.com:9443/ws/ethusdt@bookTicker"
  polymarketRtdsSymbol: "eth/usd"

persistence:
  enabled: true
  size: 2Gi
