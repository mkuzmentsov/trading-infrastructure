# at entry (floor 0.7; rule: floor < (62-tl)/59 or the bot never fires),
# band 0.55-0.99. Early tls measured NEGATIVE on sol (tl35 harvest: 2 misses
# on buyable bars erased 15 wins). Renamed from sol3 2026-08-15 (user:
# no version suffixes); prior sol3 events → data/sol3-final-20260815.jsonl.
# ⚠ deploy.sh live applies crypto.secret.yaml LAST — its caps override the
# ones below (currently $5/order $50/day there; unification pending).
