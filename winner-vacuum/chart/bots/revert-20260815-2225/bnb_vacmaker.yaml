# bnb-vacmaker LIVE — TWAP-taker lane (VACMAKER.md; wallet 0xefdf6abc…).
# ONE strategy, per-coin operating point picked by harvest (docs/vacmaker-
# offline-notes.md). bnb = early cell: eval_tl 40s, coverage ~0.37 at entry
# (floor 0.25; rule: floor < (62-tl)/59 or the bot never fires), band
# 0.55-0.98. Harvest 11/11 buyable correct; 08-15 live 11W/0L. Known cost:
# FAK no-fills when the seen ask vanishes in the ~0.6s post path (2-3/day).
# This file mirrors deployed helm values.
botName: bnb-vacmaker

bot:
  coin: bnb
  dryRun: "false"
  entrypoint: twapedge.py
  liveMaxDailyLossUsd: "15"
  liveMaxOrderUsd: "5"
  liveQuoteWarmupSecs: "0"
  liveReconcileSecs: "30"
  liveTrading: "true"
  loopIntervalSecs: "300"
  paperMode: "false"
  pmTeEvalTl: "40"
  pmTeLiveInflightUsd: "25"
  pmTeLiveSize: "9"
  pmTeLockLiveUsd: "0"
  pmTeMakerCancelBps: "1.0"
  pmTeMakerRestPx: "0"
  pmTeMaxAsk: "0.98"
  pmTeMinAsk: "0.55"
  pmTeMinCoverage: "0.25"
  pmTeSize: "8"
  pmTeSnipeCap: "0.80"
  pmTeSnipeLiveUsd: "0"
  pmTeSnipeSize: "12"
  pmTeSnipeWindowS: "120"
  pmTeThreshBps: "0.5"
  pmTeTieMaxAsk: "0"
  pmTeTwapWindow: "60"
  polymarketRtdsSymbol: bnb/usd
  prediscoveryLeadSecs: "30"
  quoteNotionalUsd: "5"
  trainingEventLogPath: /app/logs/logs-training-events.jsonl

persistence:
  enabled: true
  size: 2Gi
