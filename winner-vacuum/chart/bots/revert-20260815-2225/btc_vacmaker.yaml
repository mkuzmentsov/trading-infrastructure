# btc-vacmaker LIVE — TWAP-taker lane (VACMAKER.md; wallet 0xefdf6abc…).
# ONE strategy, per-coin operating point picked by harvest (docs/vacmaker-
# offline-notes.md). btc = mid cell: eval_tl 25s, coverage ~0.63 at entry
# (floor 0.55; rule: floor < (62-tl)/59 or the bot never fires), band
# 0.55-0.98. btc's book is the most efficient of the 7 — its winner-ask is
# almost never inside the band when the signal clears the gate, so ~0
# bets/day is EXPECTED behavior, not a fault (0 orders all of 08-15 with
# 60+ evals). Kept live as a free option on volatile days.
# This file mirrors deployed helm values.
botName: btc-vacmaker

bot:
  coin: btc
  dryRun: "false"
  entrypoint: twapedge.py
  liveMaxDailyLossUsd: "15"
  liveMaxOrderUsd: "5"
  liveQuoteWarmupSecs: "0"
  liveReconcileSecs: "30"
  liveTrading: "true"
  loopIntervalSecs: "300"
  paperMode: "false"
  pmTeEvalTl: "25"
  pmTeLiveInflightUsd: "15"
  pmTeLiveSize: "9"
  pmTeLockLiveUsd: "0"
  pmTeMakerCancelBps: "1.0"
  pmTeMakerRestPx: "0"
  pmTeMaxAsk: "0.98"
  pmTeMinAsk: "0.55"
  pmTeMinCoverage: "0.55"
  pmTeSize: "8"
  pmTeSnipeCap: "0.80"
  pmTeSnipeLiveUsd: "0"
  pmTeSnipeSize: "12"
  pmTeSnipeWindowS: "120"
  pmTeThreshBps: "0.5"
  pmTeTieMaxAsk: "0"
  pmTeTwapWindow: "60"
  polymarketRtdsSymbol: btc/usd
  prediscoveryLeadSecs: "30"
  quoteNotionalUsd: "5"
  trainingEventLogPath: /app/logs/logs-training-events.jsonl

persistence:
  enabled: true
  size: 2Gi
