# btc-snipe — settlement sniper. LIVE 2026-07-31 at 5 shares/deal (user).
#
# Risk is bounded by the ORDER, not by our code: a FAK at limit price 0.05
# cannot fill above 0.05 and leaves no resting remainder, so a wrong winner
# lock costs at most 5 * 0.05 = $0.25. Lock accuracy measured 10/10 on paper
# today and 24/24 lifetime on the vacuum's identical determination.
# snipeMaxDailyLoss $20 = ~80 consecutive wrong deals before the day halts.
#
# The edge is LUMPY: ~5 events/day on btc, 62% of value in the top 3. Long
# runs of zero fills are the expected shape, not a fault.
botName: btc-snipe
bot:
  entrypoint: "snipe.py"
  coin: "btc"
  paperMode: "false"
  dryRun: "false"
  liveTrading: "true"
  loopIntervalSecs: "300"
  trainingEventLogPath: "/app/logs/logs-training-events.jsonl"
  postCloseGraceSecs: "20"
  snipeCap: "0.05"
  # 2026-08-01: 5 -> 25 shares. The venue rejects a marketable BUY worth under
  # $1.00 ("invalid amount for a marketable BUY order ($0.25), min size: 1"),
  # and the order's dollar amount is shares x cap = 5 x 0.05 = $0.25. EVERY
  # live fire was rejected from the moment this bot went live (306/306 on
  # btc-snipe, 312/312 on btc-snipeb) -- not one order ever reached the book,
  # so the "0 fills" measured nothing. 25 x 0.05 = $1.25 clears the minimum
  # with margin; max loss per deal is $1.25. snipe.py now also floors the size
  # at ceil(SNIPE_MIN_ORDER_USD / cap) so a cap change cannot reintroduce this.
  snipeShares: "25"
  snipeFireDelayMs: "150"
  # 0 = TRADE TIES (user, 2026-07-31). Measured on 4,860 bars: 100% of the
  # settlement-snipe pot ($6,952) is in |lead|<3bps bars; the 3,105 bars with
  # |lead|>=3bps had a pot of exactly $0, so the old 3bps guard made winning
  # impossible. Cost of trading ties: lock accuracy 88.1% there vs 100%
  # elsewhere, and cheap asks sit on the LOSER 23.75% of ties vs on the winner
  # 0.44% (54:1 fill asymmetry). Net still +$1.90/4d at 5sh -- on 5 winning
  # events, so this is a measurement run, not an income stream.
  snipeMinLeadBps: "0"
  snipeMaxSpotAge: "10"
  snipeMaxDailyLoss: "20"
  favOrderType: "fak"
  binanceWsUrl: "wss://stream.binance.com:9443/ws/btcusdt@aggTrade"
  polymarketRtdsSymbol: "btc/usd"
