# eth-openlag — pre-open locked-strike taker PROBE (strat-openlag.md, 2026-08-29).
# User-approved measurement probe: $5 clips, |z|>=1.2, fire [ws-10, ws-3],
# ask band [0.30, 0.72], sticky $7/day halt. The product is DATA:
# live pre-open FAK match rate + a running detector for the seam re-opening.
# OL_EVAL logs every bar's signal regardless of gate.
botName: eth-openlag

bot:
  coin: eth
  entrypoint: openlag.py
  dryRun: "false"
  liveTrading: "true"
  paperMode: "false"
  liveMaxOrderUsd: "5"
  liveMaxDailyLossUsd: "7"
  olZMin: "1.2"
  olFireStart: "10"
  olFireEnd: "3"
  olClipUsd: "5"
  olMaxAsk: "0.72"
  olMinAsk: "0.30"
  olMinTicks: "35"
  olMinSigmaBps: "1.0"
  olMaxTickAge: "8"
  olAttempts: "2"
  polymarketRtdsSymbol: eth/usd
  trainingEventLogPath: /app/logs/logs-training-events.jsonl

persistence:
  enabled: true
  size: 1Gi
