<script id="bardata" type="application/json">__DATA__</script>
<script>
(function(){
"use strict";
var D = JSON.parse(document.getElementById('bardata').textContent);
var M = D.meta, SK = M.strike, NS = "http://www.w3.org/2000/svg";

var RANGES = {
  full:    [-1199, 424],
  market:  [-302, 2],
  endgame: [-62, 2],
  flip:    [-20, -8]
};
var state = { range:'endgame', unit:'px', token:'U', prints:true, entries:true, hoverT:null };
/* the pair is one book: UP ask === 1 - DOWN bid. Plot ONE token; map everything else onto it. */
function bk(){ return state.token==='U'
  ? {bid:D.ub, ask:D.ua, bidsz:D.ubs, asksz:D.uas, name:'UP',   other:'DOWN'}
  : {bid:D.db, ask:D.da, bidsz:D.dbs, asksz:D.das, name:'DOWN', other:'UP'}; }
function mapPx(tok, px){ return tok===state.token ? px : 1-px; }

/* ---------- helpers ---------- */
function el(tag, attrs, text){
  var n = document.createElementNS(NS, tag);
  for (var k in attrs){ if (attrs[k]!==null && attrs[k]!==undefined) n.setAttribute(k, attrs[k]); }
  if (text !== undefined) n.textContent = text;
  return n;
}
function fmtT(t){
  if (Math.abs(t) < 0.05) return 'CLOSE';
  var a = Math.abs(t), sign = t<0 ? '−' : '+';
  if (a >= 120){ var m=Math.floor(a/60), ss=Math.round(a-m*60); if(ss===60){m++;ss=0;}
                 return 'T'+sign+m+':'+String(ss).padStart(2,'0'); }
  return 'T'+sign+(a<10 ? a.toFixed(1) : a.toFixed(0))+'s';
}
function bpsOf(v){ return (v - SK) / SK * 1e4; }
/* price decimals from the tick STEP, so 0.0842488 and 78547.57 both read correctly */
function decFor(step){
  if (!(step>0)) return 2;
  return Math.max(0, Math.min(8, Math.ceil(-Math.log10(step)) + 1));
}
function sigFmt(v, sig){            /* ~sig significant digits, no exponent */
  if (v===null||v===undefined||!isFinite(v)) return '\u2014';
  var a=Math.abs(v);
  var d = a===0 ? 2 : Math.max(0, Math.min(8, (sig||7) - 1 - Math.floor(Math.log10(a))));
  return v.toFixed(d);
}
function conv(v){ return state.unit==='bps' ? bpsOf(v) : v; }
function fmtPrice(v){ return state.unit==='bps' ? (v>=0?'+':'−')+Math.abs(v).toFixed(2) : sigFmt(v,7); }
function niceTicks(lo, hi, want){
  var span = hi-lo; if (!(span>0)) return [lo];
  var raw = span/want, mag = Math.pow(10, Math.floor(Math.log10(raw))), n = raw/mag;
  var step = (n<1.5?1:n<3?2:n<7?5:10)*mag;
  var out=[], v=Math.ceil(lo/step)*step;
  for (; v<=hi+step*1e-6; v+=step) out.push(Math.round(v/step)*step);
  return out;
}
function lastIdxAtOrBefore(arr, t){
  var lo=0, hi=arr.length-1, r=-1;
  while(lo<=hi){ var m=(lo+hi)>>1; if(arr[m]<=t){ r=m; lo=m+1; } else hi=m-1; }
  return r;
}

/* ---------- chart spec ---------- */
var PADL=78, PADR=98, PADT=76, PADB=30;

function makeChart(cfg){
  var box = document.getElementById(cfg.box),
      svg = document.getElementById(cfg.svg),
      tip = document.getElementById(cfg.tip);
  var geom = null;

  var vmap = cfg.kind==='book' ? function(v){ return v; } : conv;
  function render(){
    while (svg.firstChild) svg.removeChild(svg.firstChild);
    var W = Math.max(360, box.clientWidth || 700), H = PADT + cfg.plotH + PADB;
    svg.setAttribute('viewBox', '0 0 '+W+' '+H);
    svg.setAttribute('height', H);
    svg.style.height = H+'px';

    var r = RANGES[state.range], t0=r[0], t1=r[1], plotW = W-PADL-PADR;
    var xs = function(t){ return PADL + (t-t0)/(t1-t0)*plotW; };

    /* ---- y domain ---- */
    var lo, hi, ticks, ysFmt;
    if (cfg.kind === 'book'){
      lo=0; hi=1; ticks=[0,0.25,0.5,0.75,1];
      ysFmt = function(v){ return v.toFixed(2); };
    } else {
      var mn=Infinity, mx=-Infinity;
      function scan(tArr, vArr){
        for (var i=0;i<tArr.length;i++){
          if (tArr[i]<t0 || tArr[i]>t1) continue;
          var v=vArr[i]; if (v===null||v===undefined) continue;
          if (v<mn) mn=v; if (v>mx) mx=v;
        }
      }
      scan(D.t, D.cl); scan(D.t, D.tw); scan(D.bt, D.bm);
      if (!isFinite(mn)){ mn=SK*0.999; mx=SK*1.001; }
      [SK, M.final].forEach(function(L){
        if (L===null||L===undefined||!isFinite(L)) return;
        if (L<mn) mn=L; if (L>mx) mx=L;
      });
      var pad=(mx-mn)*0.10 || SK*1e-5;
      lo=conv(mn-pad); hi=conv(mx+pad);
      if (hi<lo){ var tmp=lo; lo=hi; hi=tmp; }
      ticks = niceTicks(lo, hi, 5);
      var tdec = decFor(ticks.length>1 ? Math.abs(ticks[1]-ticks[0]) : (hi-lo)/5);
      ysFmt = function(v){ return state.unit==='bps'
        ? (v>0?'+':v<0?'−':'')+Math.abs(v).toFixed(v===0?0:1)
        : v.toFixed(tdec); };
    }
    var ys = function(v){ return PADT + (1-(v-lo)/(hi-lo))*cfg.plotH; };
    geom = { W:W, H:H, t0:t0, t1:t1, xs:xs, ys:ys, lo:lo, hi:hi };

    var defs = el('defs'); svg.appendChild(defs);
    var pid = cfg.svg+'-hatch';
    var pat = el('pattern',{id:pid,width:7,height:7,patternUnits:'userSpaceOnUse',
      patternTransform:'rotate(45)'});
    pat.appendChild(el('line',{x1:0,y1:0,x2:0,y2:7,stroke:'var(--hatch)','stroke-width':1}));
    defs.appendChild(pat);
    var g = el('g'); svg.appendChild(g);

    /* ---- lifecycle regions: pre-open / post-close ---- */
    function wash(a,b,label){
      var x0=Math.max(PADL, xs(a)), x1=Math.min(W-PADR, xs(b));
      if (x1-x0 < 1) return;
      g.appendChild(el('rect',{x:x0,y:PADT,width:x1-x0,height:cfg.plotH,fill:'url(#'+pid+')'}));
      if (label && x1-x0 > 74){
        g.appendChild(el('text',{x:(x0+x1)/2,y:15,'text-anchor':'middle',
          'font-family':'"IBM Plex Mono",monospace','font-size':10,'letter-spacing':'.09em',
          fill:'var(--muted)'}, label));
      }
    }
    wash(t0, -300, 'PRE-OPEN');
    wash(0, t1, 'POST-CLOSE');

    /* ---- TWAP averaging windows (price chart only) ---- */
    if (cfg.kind === 'price'){
      [[M.strike_win[0], M.strike_win[1], 'STRIKE WINDOW'],
       [M.final_win[0],  M.final_win[1],  'FINAL WINDOW']].forEach(function(w){
        var x0=Math.max(PADL, xs(w[0])), x1=Math.min(W-PADR, xs(w[1]));
        if (x1-x0 < 1) return;
        g.appendChild(el('rect',{x:x0,y:PADT,width:x1-x0,height:cfg.plotH,fill:'var(--band)'}));
        if (x1-x0 > 92){
          g.appendChild(el('text',{x:(x0+x1)/2,y:PADT+13,'text-anchor':'middle',
            'font-family':'"IBM Plex Mono",monospace','font-size':10,'letter-spacing':'.07em',
            fill:'var(--cl)'}, w[2]));
        }
      });
    }

    /* ---- grid + y axis ---- */
    ticks.forEach(function(v){
      var y=ys(v); if (y<PADT-1||y>PADT+cfg.plotH+1) return;
      g.appendChild(el('line',{x1:PADL,x2:W-PADR,y1:y,y2:y,stroke:'var(--grid)','stroke-width':1}));
      g.appendChild(el('text',{x:PADL-9,y:y+3.5,'text-anchor':'end',
        'font-family':'"IBM Plex Mono",monospace','font-size':10.5,fill:'var(--muted)'}, ysFmt(v)));
    });
    g.appendChild(el('text',{x:PADL-9,y:PADT-10,'text-anchor':'end',
      'font-family':'"IBM Plex Mono",monospace','font-size':10,'letter-spacing':'.07em',
      fill:'var(--muted)'}, cfg.kind==='book' ? 'PRICE' : (state.unit==='bps'?'BPS':'USD')));

    /* ---- x axis ---- */
    var xt = niceTicks(t0, t1, 7);
    xt.forEach(function(t){
      var x=xs(t); if (x<PADL-1||x>W-PADR+1) return;
      g.appendChild(el('line',{x1:x,x2:x,y1:PADT+cfg.plotH,y2:PADT+cfg.plotH+4,stroke:'var(--axis)','stroke-width':1}));
      g.appendChild(el('text',{x:x,y:PADT+cfg.plotH+17,'text-anchor':'middle',
        'font-family':'"IBM Plex Mono",monospace','font-size':10.5,fill:'var(--muted)'}, fmtT(t)));
    });
    g.appendChild(el('line',{x1:PADL,x2:W-PADR,y1:PADT+cfg.plotH,y2:PADT+cfg.plotH,
      stroke:'var(--axis)','stroke-width':1}));

    /* ---- the two levels that decide the bar: OPEN (strike) and CLOSE (final) ---- */
    var levels = [];
    if (cfg.kind === 'price'){
      levels = [
        {v:SK,      name:'OPEN',  dash:'4 3', col:'var(--ink-2)'},
        {v:M.final, name:'CLOSE', dash:null,  col:'var(--ink)'}
      ].filter(function(L){ return L.v!==null && L.v!==undefined && isFinite(L.v); });
      levels.forEach(function(L){
        L.y = ys(conv(L.v));
        g.appendChild(el('line',{x1:PADL,x2:W-PADR,y1:L.y,y2:L.y,stroke:L.col,
          'stroke-width':1.5,'stroke-dasharray':L.dash,'stroke-linecap':'round',opacity:.75}));
      });
    }

    /* ---- series ---- */
    function path(tArr, vArr, stroke, width, opacity){
      var stride = Math.max(1, Math.floor(tArr.length/(plotW*2)));
      var d='', pen=false;
      for (var i=0;i<tArr.length;i+=stride){
        var t=tArr[i]; if (t<t0-1||t>t1+1){ pen=false; continue; }
        var v=vArr[i];
        if (v===null||v===undefined){ pen=false; continue; }
        var x=xs(t).toFixed(1), y=ys(vmap(v)).toFixed(1);
        d += (pen?'L':'M')+x+' '+y+' '; pen=true;
      }
      if (!d) return;
      g.appendChild(el('path',{d:d,fill:'none',stroke:stroke,'stroke-width':width,
        'stroke-linejoin':'round','stroke-linecap':'round',opacity:opacity||1}));
    }
    function band(tArr, loArr, hiArr, fill, op){
      var stride = Math.max(1, Math.floor(tArr.length/(plotW*2)));
      var segs=[], cur=null;
      for (var i=0;i<tArr.length;i+=stride){
        var t=tArr[i]; if (t<t0-1||t>t1+1){ if(cur&&cur.length>1)segs.push(cur); cur=null; continue; }
        var a=loArr[i], b=hiArr[i];
        if (a===null||b===null||a===undefined||b===undefined){ if(cur&&cur.length>1)segs.push(cur); cur=null; continue; }
        if (!cur) cur=[];
        cur.push([xs(t), ys(a), ys(b)]);
      }
      if (cur&&cur.length>1) segs.push(cur);
      segs.forEach(function(sg){
        var d='M'+sg[0][0].toFixed(1)+' '+sg[0][1].toFixed(1);
        for (var i=1;i<sg.length;i++) d+='L'+sg[i][0].toFixed(1)+' '+sg[i][1].toFixed(1);
        for (var j=sg.length-1;j>=0;j--) d+='L'+sg[j][0].toFixed(1)+' '+sg[j][2].toFixed(1);
        d+='Z';
        g.appendChild(el('path',{d:d,fill:fill,opacity:(op===undefined?.20:op),stroke:'none'}));
      });
    }

    var labels = [];
    function endLabel(tArr, vArr, color, text){
      for (var i=tArr.length-1;i>=0;i--){
        if (tArr[i]>t1) continue;
        if (tArr[i]<t0) break;
        var v=vArr[i]; if (v===null||v===undefined) continue;
        labels.push({y:ys(vmap(v)), color:color, text:text});
        return;
      }
    }

    if (cfg.kind === 'book'){
      var B = bk();
      band(D.t, B.bid, B.ask, 'var(--spread)', .85);
      path(D.t, B.bid, 'var(--bid)', 2);
      path(D.t, B.ask, 'var(--ask)', 2);
      endLabel(D.t, B.ask, 'var(--ask)', 'ask');
      endLabel(D.t, B.bid, 'var(--bid)', 'bid');

      /* market prints: ink triangles — direction by SHAPE, never by hue */
      if (state.prints){
        D.prints.forEach(function(p){
          if (p.t<t0||p.t>t1) return;
          var v = mapPx(p.tok, p.px);
          var h = Math.max(4.5, Math.min(9.5, 3.6+Math.sqrt(p.sz)));
          var cx = xs(p.t), cy = ys(v), up = (p.tok===state.token);
          var pts = up ? (cx)+','+(cy-h)+' '+(cx+h*0.92)+','+(cy+h*0.62)+' '+(cx-h*0.92)+','+(cy+h*0.62)
                       : (cx)+','+(cy+h)+' '+(cx+h*0.92)+','+(cy-h*0.62)+' '+(cx-h*0.92)+','+(cy-h*0.62);
          g.appendChild(el('polygon',{points:pts,fill:'var(--ink-2)',
            stroke:'var(--panel)','stroke-width':1.6,opacity:.85}));
        });
      }
    } else {
      path(D.t,  D.tw, 'var(--twap)', 2);
      path(D.bt, D.bm, 'var(--bin)',  1.75, .95);
      path(D.t,  D.cl, 'var(--cl)',   2.25);
      endLabel(D.t,  D.cl, 'var(--cl)',   'Chainlink');
      endLabel(D.t,  D.tw, 'var(--twap)', 'TWAP');
      endLabel(D.bt, D.bm, 'var(--bin)',  'Binance');
    }

    /* ---- direct labels, de-collided ---- */
    levels.forEach(function(L){ labels.push({y:L.y, color:L.col, text:L.name, mono:true}); });
    labels.sort(function(a,b){ return a.y-b.y; });
    var GAP=15;
    for (var i=1;i<labels.length;i++)
      if (labels[i].y - labels[i-1].y < GAP) labels[i].y = labels[i-1].y + GAP;
    if (labels.length){
      /* shift the WHOLE stack back inside the plot — clamping each label
         individually silently re-collapses a stack that ran off the bottom */
      var over = labels[labels.length-1].y - (PADT+cfg.plotH);
      if (over > 0) labels.forEach(function(L){ L.y -= over; });
      var under = (PADT+8) - labels[0].y;
      if (under > 0) labels.forEach(function(L){ L.y += under; });
    }
    labels.forEach(function(L){
      g.appendChild(el('text',{x:W-PADR+8,y:L.y+3.5,
        'font-family':L.mono?'"IBM Plex Mono",monospace':'"IBM Plex Sans",sans-serif',
        'font-size':L.mono?10:11.5,'letter-spacing':L.mono?'.06em':null,
        'font-weight':L.mono?600:500,fill:L.color}, L.text));
    });

    /* ---- level chips: the NUMBER on the y-axis where numbers live,
           the NAME in the right margin where names live ---- */
    if (levels.length){
      var chips = levels.map(function(L){ return {y:L.y, L:L}; }).sort(function(a,b){ return a.y-b.y; });
      for (var ci=1; ci<chips.length; ci++)
        if (chips[ci].y - chips[ci-1].y < 24) chips[ci].y = chips[ci-1].y + 24;
      var ov = chips[chips.length-1].y - (PADT+cfg.plotH-11);
      if (ov > 0) chips.forEach(function(c){ c.y -= ov; });
      var un = (PADT+11) - chips[0].y;
      if (un > 0) chips.forEach(function(c){ c.y += un; });
      chips.forEach(function(c){
        var L=c.L;
        var txt = state.unit==='bps' ? fmtPrice(bpsOf(L.v)) : sigFmt(L.v, 9);
        // two lines: the NAME so the chip is self-describing, the VALUE under it.
        // A value-only chip is ambiguous the moment the two levels de-collide.
        var w = Math.min(PADL-6, Math.max(txt.length*5.75, 34) + 11), x0 = PADL-4-w;
        g.appendChild(el('rect',{x:x0,y:c.y-11,width:w,height:22,rx:2,
          fill:'var(--panel)',stroke:L.col,'stroke-width':1,opacity:.97}));
        g.appendChild(el('text',{x:x0+w/2,y:c.y-1.5,'text-anchor':'middle',
          'font-family':'"IBM Plex Mono",monospace','font-size':8,'letter-spacing':'.1em',
          'font-weight':600,fill:L.col}, L.name));
        g.appendChild(el('text',{x:x0+w/2,y:c.y+8.5,'text-anchor':'middle',
          'font-family':'"IBM Plex Mono",monospace','font-size':9.5,
          'font-variant-numeric':'tabular-nums',fill:'var(--ink)'}, txt));
        if (Math.abs(c.y - L.y) > 1.5)          /* chip was nudged — point back at the real line */
          g.appendChild(el('line',{x1:PADL-3,y1:c.y,x2:PADL,y2:L.y,stroke:L.col,
            'stroke-width':1,opacity:.55}));
      });
    }

    /* ---- market open / close rules ---- */
    [[-300,'OPEN'],[0,'CLOSE']].forEach(function(mk){
      var x=xs(mk[0]); if (x<PADL-0.5||x>W-PADR+0.5) return;
      g.appendChild(el('line',{x1:x,x2:x,y1:26,y2:PADT+cfg.plotH,
        stroke:'var(--ink)','stroke-width':1.5,opacity:.55}));
      g.appendChild(el('text',{x:x,y:22,'text-anchor':'middle',
        'font-family':'"IBM Plex Mono",monospace','font-size':10,'font-weight':600,
        'letter-spacing':'.09em',fill:'var(--ink)'}, mk[1]));
    });

    /* ---- our entries ---- */
    if (state.entries){
      M.entries.forEach(function(e, idx){
        var x=xs(e.t); if (x<PADL-0.5||x>W-PADR+0.5) return;
        var chip = e.result==='LOST' ? 'var(--bad)' : e.result==='WON' ? 'var(--good)' : 'var(--muted)';
        var ruleCol = e.kind==='live' ? 'var(--ink)' : 'var(--muted)';
        var dash = e.kind==='live' ? null : (e.kind==='paper' ? '4 3' : '1 3');
        var ty = 40 + idx*13;                       /* annotation row in the gutter */
        g.appendChild(el('line',{x1:x,x2:x,y1:ty-8,y2:PADT+cfg.plotH,stroke:ruleCol,
          'stroke-width':e.kind==='live'?1.75:1.25,'stroke-dasharray':dash,
          'stroke-linecap':'round',opacity:e.kind==='live'?.8:.6}));
        if (cfg.kind==='book' && e.px!==null && e.px!==undefined){
          g.appendChild(el('circle',{cx:x,cy:ys(mapPx(e.side==='UP'?'U':'D', e.px)),r:5,
            fill:chip,stroke:'var(--panel)','stroke-width':2}));
        }
        var px2 = (e.px===null||e.px===undefined) ? '?' : e.px.toFixed(2);
        var res = e.result==='LOST' ? ' \u2192 lost' : e.result==='WON' ? ' \u2192 won' : '';
        if (res && e.pnl!==null && e.pnl!==undefined) res += ' $'+Math.abs(e.pnl).toFixed(2);
        var tag = e.kind==='live'  ? 'FILL '+e.side+' @'+px2+res
                : e.kind==='paper' ? 'paper '+e.side+' @'+px2+res
                : 'blocked @'+px2;
        var anchor = 'end', tx = x-11, cxp = x-6;
        if (tx - tag.length*5.7 < PADL){ anchor='start'; tx = x+11; cxp = x+6; }
        g.appendChild(el('rect',{x:cxp-3,y:ty-7,width:6,height:6,fill:chip,rx:1}));
        g.appendChild(el('text',{x:tx,y:ty,'text-anchor':anchor,
          'font-family':'"IBM Plex Mono",monospace','font-size':10.5,
          'font-weight':e.kind==='live'?600:400,
          fill:e.kind==='live'?'var(--ink)':'var(--ink-2)'}, tag));
      });
    }

    /* ---- crosshair layer ---- */
    var hair = el('g',{id:cfg.svg+'-hair'}); svg.appendChild(hair);
    drawHair(hair);
  }

  function drawHair(hair){
    while (hair.firstChild) hair.removeChild(hair.firstChild);
    if (state.hoverT===null || !geom) { tip.classList.remove('on'); return; }
    var t=state.hoverT;
    if (t<geom.t0||t>geom.t1){ tip.classList.remove('on'); return; }
    var x=geom.xs(t);
    hair.appendChild(el('line',{x1:x,x2:x,y1:PADT,y2:PADT+cfg.plotH,
      stroke:'var(--ink)','stroke-width':1,opacity:.35}));

    var rows=[], i;
    if (cfg.kind==='book'){
      i = lastIdxAtOrBefore(D.t, t);
      if (i<0){ tip.classList.remove('on'); return; }
      var Bk = bk();
      rows = [
        ['ask',    Bk.ask[i], Bk.asksz[i], 'var(--ask)'],
        ['bid',    Bk.bid[i], Bk.bidsz[i], 'var(--bid)'],
        ['spread', (Bk.ask[i]!==null&&Bk.bid[i]!==null)?+(Bk.ask[i]-Bk.bid[i]).toFixed(3):null, null, 'var(--muted)']
      ];
      rows.forEach(function(r){
        if (r[1]===null||r[1]===undefined) return;
        hair.appendChild(el('circle',{cx:x,cy:geom.ys(r[1]),r:3.5,fill:r[3],
          stroke:'var(--panel)','stroke-width':1.5}));
      });
      tip.innerHTML = '<div class="th">'+fmtT(t)+' \u00b7 '+bk().name+' token</div>' + rows.map(function(r){
        return '<div class="row"><span class="k"><i style="background:'+r[3]+'"></i>'+r[0]+'</span><b>'+
          (r[1]===null||r[1]===undefined ? '—' : r[1].toFixed(2)+
           (r[2]?' <span style="color:var(--muted)">×'+r[2].toFixed(0)+'</span>':'')) + '</b></div>';
      }).join('');
    } else {
      i = lastIdxAtOrBefore(D.t, t);
      var j = lastIdxAtOrBefore(D.bt, t);
      var items = [
        ['Chainlink', i>=0?D.cl[i]:null, 'var(--cl)'],
        ['TWAP',      i>=0?D.tw[i]:null, 'var(--twap)'],
        ['Binance',   j>=0?D.bm[j]:null, 'var(--bin)']
      ];
      items.forEach(function(r){
        if (r[1]===null||r[1]===undefined) return;
        hair.appendChild(el('circle',{cx:x,cy:geom.ys(vmap(r[1])),r:3.5,fill:r[2],
          stroke:'var(--panel)','stroke-width':1.5}));
      });
      tip.innerHTML = '<div class="th">'+fmtT(t)+'</div>' + items.map(function(r){
        if (r[1]===null||r[1]===undefined)
          return '<div class="row"><span class="k"><i style="background:'+r[2]+'"></i>'+r[0]+'</span><b>—</b></div>';
        var b=bpsOf(r[1]);
        return '<div class="row"><span class="k"><i style="background:'+r[2]+'"></i>'+r[0]+
          '</span><b>'+sigFmt(r[1],8)+' <span style="color:var(--muted)">'+
          (b>=0?'+':'−')+Math.abs(b).toFixed(2)+'</span></b></div>';
      }).join('') + '<div class="row" style="margin-top:4px;color:var(--muted)"><span>vs strike, bps</span></div>';
    }

    tip.classList.add('on');
    var bw = box.clientWidth, sc = bw/geom.W, px = x*sc;
    var tw = tip.offsetWidth || 186;
    tip.style.left = (px + tw + 18 > bw ? px - tw - 12 : px + 12) + 'px';
    tip.style.top  = (PADT*sc + 6) + 'px';
  }

  function onMove(ev){
    if (!geom) return;
    var rect = box.getBoundingClientRect();
    var cx = (ev.touches ? ev.touches[0].clientX : ev.clientX) - rect.left;
    var sc = geom.W / (box.clientWidth || geom.W);
    var xu = cx * sc;
    if (xu < PADL || xu > geom.W-PADR){ state.hoverT=null; }
    else state.hoverT = geom.t0 + (xu-PADL)/(geom.W-PADL-PADR)*(geom.t1-geom.t0);
    API.hair();
  }
  box.addEventListener('mousemove', onMove);
  box.addEventListener('touchmove', function(e){ onMove(e); }, {passive:true});
  box.addEventListener('mouseleave', function(){ state.hoverT=null; API.hair(); });

  var API = {
    render: render,
    hairSelf: function(){ var h=document.getElementById(cfg.svg+'-hair'); if(h) drawHair(h); },
    hair: function(){}
  };
  return API;
}

var c1 = makeChart({box:'box1', svg:'svg1', tip:'tip1', plotH:250, kind:'book'});
var c2 = makeChart({box:'box2', svg:'svg2', tip:'tip2', plotH:220, kind:'price'});
c1.hair = c2.hair = function(){ c1.hairSelf(); c2.hairSelf(); };

function renderAll(){ c1.render(); c2.render(); }

/* ---------- controls ---------- */
function bindSeg(attr, apply){
  var btns = Array.prototype.slice.call(document.querySelectorAll('button.seg['+attr+']'));
  btns.forEach(function(b){
    b.addEventListener('click', function(){
      btns.forEach(function(o){ o.setAttribute('aria-pressed','false'); });
      b.setAttribute('aria-pressed','true');
      apply(b.getAttribute(attr));
      renderAll();
    });
  });
}
bindSeg('data-range', function(v){ state.range=v; });
bindSeg('data-unit',  function(v){ state.unit=v; });
bindSeg('data-token', function(v){
  state.token=v;
  var nm = v==='U' ? 'UP' : 'DOWN';
  document.getElementById('tokname').textContent = nm;
  document.getElementById('tokname2').textContent = nm;
});
Array.prototype.slice.call(document.querySelectorAll('button.seg[data-tog]')).forEach(function(b){
  b.addEventListener('click', function(){
    var k=b.getAttribute('data-tog'), on = b.getAttribute('aria-pressed')!=='true';
    b.setAttribute('aria-pressed', on?'true':'false');
    state[k]=on; renderAll();
  });
});


/* ---------- header / facts / entries, all rendered from meta ---------- */
function esc(x){ return String(x).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
(function(){
  document.getElementById('hd-slug').textContent  = M.venue_label || ('polymarket \u00b7 '+M.slug);
  document.getElementById('hd-title').innerHTML   = M.title_html || esc(M.slug);
  document.getElementById('hd-sub').textContent   = M.subtitle || '';
  document.getElementById('hd-win').textContent   = 'Resolved '+M.win;
  document.getElementById('hd-margin').textContent= M.margin_bps===null||M.margin_bps===undefined
      ? 'margin unknown'
      : 'by '+Math.abs(M.margin_bps).toFixed(3)+' bps';
  document.getElementById('hd-dot').style.background = M.win==='UP' ? 'var(--ask)' : 'var(--bid)';
  document.title = M.page_title || document.title;
  document.getElementById('unit-px').textContent = (M.coin||'').toUpperCase()+'/USD';

  var f=document.getElementById('facts');
  (M.facts||[]).forEach(function(x){
    var d=document.createElement('div'); d.className='fact';
    d.innerHTML = '<dt>'+esc(x.label)+'</dt><dd'+(x.tone?' class="'+x.tone+'"':'')+'>'+
      esc(x.value)+(x.sub?'<small>'+esc(x.sub)+'</small>':'')+'</dd>';
    f.appendChild(d);
  });

  var er=document.getElementById('entryrows');
  (M.entries||[]).forEach(function(e){
    var live = e.kind==='live';
    var tone = e.result==='LOST' ? 'neg' : e.result==='WON' ? 'pos' : '';
    var pnl  = (e.pnl===null||e.pnl===undefined) ? '\u2014'
             : (e.pnl<0?'\u2212$':'+$')+Math.abs(e.pnl).toFixed(2);
    var w = function(v){ return live ? '<b>'+v+'</b>' : v; };
    var tr=document.createElement('tr');
    tr.innerHTML =
      '<td>'+w(esc(e.event||''))+'</td>'+
      '<td>'+w(Math.abs(e.t).toFixed(1)+'s')+'</td>'+
      '<td>'+w(esc(e.side||'\u2014'))+'</td>'+
      '<td>'+w(e.px===null||e.px===undefined?'\u2014':e.px.toFixed(2))+'</td>'+
      '<td>'+w(e.sh===null||e.sh===undefined?'\u2014':e.sh.toFixed(2))+'</td>'+
      '<td>'+w(e.est_bps===null||e.est_bps===undefined?'\u2014':(e.est_bps>0?'+':'\u2212')+Math.abs(e.est_bps).toFixed(3))+'</td>'+
      '<td class="'+tone+'">'+w(esc((e.result||'').toLowerCase()))+'</td>'+
      '<td class="'+tone+'">'+w(pnl)+'</td>'+
      '<td class="note">'+(e.note||'')+'</td>';
    er.appendChild(tr);
  });

  document.getElementById('srcnote').innerHTML = M.source_html || '';
})();

/* ---------- prints table ---------- */
(function(){
  var tb=document.getElementById('printrows');
  D.prints.forEach(function(p){
    var isw = p.tok==='D';
    var gross = isw ? (1-p.px)*p.sz : -p.px*p.sz;
    var fee = p.sz*0.07*p.px*(1-p.px);
    var net = gross-fee;
    var tr=document.createElement('tr');
    tr.innerHTML = '<td>'+fmtT(p.t)+'</td>'+
      '<td>'+(p.tok==='U'?'UP':'DOWN')+'</td>'+
      '<td>'+p.px.toFixed(2)+'</td><td>'+p.sz.toFixed(2)+'</td>'+
      '<td>$'+(p.px*p.sz).toFixed(2)+'</td>'+
      '<td class="'+(net<0?'neg':'pos')+'">'+(net<0?'−$':'+$')+Math.abs(net).toFixed(2)+'</td>';
    tb.appendChild(tr);
  });
})();

var rt;
window.addEventListener('resize', function(){ clearTimeout(rt); rt=setTimeout(renderAll,120); });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(renderAll);
renderAll();
})();
</script>
