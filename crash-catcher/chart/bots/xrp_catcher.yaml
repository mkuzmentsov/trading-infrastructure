# xrp-catcher — both-side 1c crash-catcher. GTC bids at $0.01 x 5 shares on
# BOTH tokens from bar open (early FIFO queue position), cancelled 0.7s before
# close (post-close a 1c bid on the loser is a guaranteed donation). Fills only
# when a panic-dump sweeps to 1c; ~4-5% of fills win at settlement = 100x.
# Validated source: 0xCd9bf7F6 (115d, +$22k at 5% WR on 1c fills).
# Sizing: 5 shares = $0.05/side ($0.10/bar posted) — user-set validation size.
botName: xrp-catcher

bot:
  entrypoint: "catcher.py"
  coin: "xrp"
  paperMode: "true"
  dryRun: "true"
  liveTrading: "false"
  loopIntervalSecs: "300"
  trainingEventLogPath: "/app/logs/logs-training-events.jsonl"
  postCloseGraceSecs: "0"
  catchPrice: "0.02"
  catchShares: "5"
  catchCancelTl: "0.7"
  catchMaxDailyLoss: "5"
  favOrderType: "gtc"
  liveMaxOrderUsd: "1"
  liveMaxDailyLossUsd: "5"
  binanceWsUrl: "wss://stream.binance.com:9443/ws/xrpusdt@aggTrade"
  polymarketRtdsSymbol: "xrp/usd"
