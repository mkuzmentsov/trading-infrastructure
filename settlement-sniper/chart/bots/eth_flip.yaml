# eth-flip — CONTRARIAN near-tie flip bet (PAPER first). Buys the cheap trailing
# side (≤2c) on bars where Binance shows only a near-tie (not decisive), betting
# the Chainlink settlement flips it to $1. $1/bet, $20/day cap. Measures the
# flip win-rate of this exact condition before any real money.
# Install: ./deploy.sh (or) helm upgrade --install eth-flip-every-tick-single \
#   ./chart -f chart/bots/eth_flip.yaml -n every-tick-single
botName: eth-flip

bot:
  entrypoint: "flipbet.py"
  coin: "eth"
  paperMode: "true"
  dryRun: "true"
  liveTrading: "false"
  loopIntervalSecs: "300"
  trainingEventLogPath: "/app/logs/logs-training-events.jsonl"
  postCloseGraceSecs: "5"
  flipCap: "0.02"
  flipTlLo: "-3"
  flipTlHi: "60"
  flipMinLeadBps: "1"
  flipMaxLeadBps: "15"
  flipNotional: "1"
  flipMaxDailyLoss: "20"
  favOrderType: "fak"
  binanceWsUrl: "wss://stream.binance.com:9443/ws/ethusdt@aggTrade"
  polymarketRtdsSymbol: "eth/usd"

persistence:
  enabled: false
