# eth-snipe — POST-CLOSE settlement-sniper. Locks the winner at bar-close
# (spot vs open) and fires blind FAK sweeps at <=5c on the winning token during
# the first ~7s of the resolution delay, holding to settle. $5/deal, $20/day cap.
# LIVE deploy (real money): layer the creds overlay LAST so it flips live:
#   helm upgrade --install eth-snipe-every-tick-single ./chart \
#     -f chart/bots/eth_snipe.yaml -f chart/bots/pm.secret.yaml \
#     --set bot.liveMaxOrderUsd=5 --set bot.liveMaxDailyLossUsd=20 \
#     -n every-tick-single
botName: eth-snipe

bot:
  entrypoint: "snipe.py"
  coin: "eth"
  paperMode: "true"
  dryRun: "true"
  liveTrading: "false"
  loopIntervalSecs: "300"
  trainingEventLogPath: "/app/logs/logs-training-events.jsonl"
  postCloseGraceSecs: "10"
  snipeCap: "0.05"
  snipeFireMaxSecs: "7"
  snipeNotional: "5"
  snipeMinLeadBps: "8"
  snipeFireIntervalSecs: "0.5"
  snipeMaxAttempts: "16"
  snipeMaxDailyLoss: "20"
  favOrderType: "gtc"
  binanceWsUrl: "wss://stream.binance.com:9443/ws/ethusdt@aggTrade"
  polymarketRtdsSymbol: "eth/usd"
