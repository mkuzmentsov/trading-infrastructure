apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "polymarket-portfolio-bot.name" . }}
  labels:
    {{- include "polymarket-portfolio-bot.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "polymarket-portfolio-bot.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "polymarket-portfolio-bot.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        checksum/script: {{ include (print $.Template.BasePath "/configmap-script.yaml") . | sha256sum }}
    spec:
      {{- if .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      {{- end }}
      containers:
        - name: polymarket-portfolio
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "/app/scripts/main.py"]
          env:
            - name: PYTHONPATH
              value: /app/scripts
          envFrom:
            - secretRef:
                name: {{ include "polymarket-portfolio-bot.name" . }}-secret
          volumeMounts:
            - name: script
              mountPath: /app/scripts
            - name: data
              mountPath: /app/data
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: script
          configMap:
            name: {{ include "polymarket-portfolio-bot.name" . }}-script
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "polymarket-portfolio-bot.name" . }}-pvc
          {{- else }}
          emptyDir: {}
          {{- end }}
