apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "polymarket-portfolio-bot.name" . }}-script
  labels:
    {{- include "polymarket-portfolio-bot.labels" . | nindent 4 }}
data:
  {{- range $path, $content := .Files.Glob "files/scripts/*.py" }}
  {{ base $path }}: |
{{ $content | toString | indent 4 }}
  {{- end }}
