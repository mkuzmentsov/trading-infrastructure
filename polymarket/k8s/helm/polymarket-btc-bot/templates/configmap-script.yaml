apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "polymarket-btc-bot.name" . }}-script
  labels:
    {{- include "polymarket-btc-bot.labels" . | nindent 4 }}
data:
  {{- range $path, $content := .Files.Glob "files/scripts/*.py" }}
  {{ $path | trimPrefix "files/scripts/" | replace "/" "__" }}: |
{{ $content | toString | indent 4 }}
  {{- end }}
  {{- range $path, $content := .Files.Glob "files/scripts/**/*.py" }}
  {{ $path | trimPrefix "files/scripts/" | replace "/" "__" }}: |
{{ $content | toString | indent 4 }}
  {{- end }}
