apiVersion: v1
kind: Secret
metadata:
  name: {{ include "polymarket-btc-bot.name" . }}-secret
  labels:
    {{- include "polymarket-btc-bot.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Polymarket credentials
  POLYMARKET_PK:               {{ .Values.credentials.polymarketPrivateKey | quote }}
  POLYMARKET_ADDRESS:          {{ .Values.credentials.polymarketAddress | quote }}
  POLYMARKET_API_KEY:          {{ .Values.credentials.polymarketApiKey | quote }}
  POLYMARKET_API_SECRET:       {{ .Values.credentials.polymarketApiSecret | quote }}
  POLYMARKET_API_PASSPHRASE:   {{ .Values.credentials.polymarketApiPassphrase | quote }}
  POLYMARKET_SIGNATURE_TYPE:   {{ .Values.credentials.polymarketSignatureType | quote }}
  POLYMARKET_FUNDER:           {{ .Values.credentials.polymarketFunder | quote }}
  # Bot behaviour
  APP_LOG_LEVEL:      {{ .Values.bot.appLogLevel | quote }}
  DRY_RUN:            {{ .Values.bot.dryRun | quote }}
  LOOP_INTERVAL_SECS: {{ .Values.bot.loopIntervalSecs | quote }}
  BET_SIZE_MIN:       {{ .Values.bot.betSizeMin | quote }}
  BET_SIZE_MAX:       {{ .Values.bot.betSizeMax | quote }}
  MAX_BUDGET_FRACTION: {{ .Values.bot.maxBudgetFraction | default "0.10" | quote }}
  # Signal parameters
  MIN_EDGE:           {{ .Values.bot.minEdge | quote }}
  COST_BUFFER:        {{ .Values.bot.costBuffer | quote }}
  KELLY_SCALE:        {{ .Values.bot.kellyScale | quote }}
  ENTRY_MIN_SECONDS_LEFT: {{ .Values.bot.entryMinSecondsLeft | quote }}
  MAX_ENTRY_SPREAD:   {{ .Values.bot.maxEntrySpread | quote }}
  MIN_ENTRY_PRICE:    {{ .Values.bot.minEntryPrice | default "0.15" | quote }}
  MAX_ENTRY_PRICE:    {{ .Values.bot.maxEntryPrice | default "0.40" | quote }}
  SOURCE_MISMATCH_BUFFER: {{ .Values.bot.sourceMismatchBuffer | quote }}
  MODEL_PROB_SHRINK:  {{ .Values.bot.modelProbShrink | quote }}
  MODEL_PROB_FLOOR:   {{ .Values.bot.modelProbFloor | quote }}
  MODEL_PROB_CEIL:    {{ .Values.bot.modelProbCeil | quote }}
  STRATEGY_NAME:      {{ .Values.bot.strategyName | default "latency_arb_hold" | quote }}
  SIGNAL_MODEL:       {{ .Values.bot.signalModel | default "math" | quote }}
  ML_BLEND_WEIGHT:    {{ .Values.bot.mlBlendWeight | default "0.50" | quote }}
  ENTRY_GATE_MODEL_PATH: {{ .Values.bot.entryGateModelPath | default "/app/model/pm_btc_entry_gate_model.txt" | quote }}
  ENTRY_GATE_THRESHOLD: {{ .Values.bot.entryGateThreshold | default "0.55" | quote }}
  ENTRY_GATE_MIN_PRICE: {{ .Values.bot.entryGateMinPrice | default "0.30" | quote }}
  ENTRY_GATE_CHEAP_OVERRIDE_SCORE: {{ .Values.bot.entryGateCheapOverrideScore | default "0.78" | quote }}
  ENTRY_GATE_CHEAP_OVERRIDE_EDGE: {{ .Values.bot.entryGateCheapOverrideEdge | default "0.20" | quote }}
  MAX_ABS_DRIFT:      {{ .Values.bot.maxAbsDrift | quote }}
  MIN_POSITION_SHARES: {{ .Values.bot.minPositionShares | quote }}
  ENTRY_CONFIRMATION_TICKS: {{ .Values.bot.entryConfirmationTicks | quote }}
  FILTER_CONTRARIAN_ENTRIES: {{ .Values.bot.filterContrarianEntries | default "false" | quote }}
  CONTRARIAN_TAIL_MAX_PRICE: {{ .Values.bot.contrarianTailMaxPrice | default "0.25" | quote }}
  CONTRARIAN_MOVE_FILTER: {{ .Values.bot.contrarianMoveFilter | default "0.0015" | quote }}
  CHEAP_TAIL_EDGE_BONUS: {{ .Values.bot.cheapTailEdgeBonus | default "0.05" | quote }}
  LATE_BAR_EDGE_BONUS: {{ .Values.bot.lateBarEdgeBonus | default "0.04" | quote }}
  LATE_BAR_WINDOW_SECS: {{ .Values.bot.lateBarWindowSecs | default "75" | quote }}
  MIN_BTC_DISTANCE:   {{ .Values.bot.minBtcDistance | default "0.0004" | quote }}
  MIN_BOOK_DIVERGENCE: {{ .Values.bot.minBookDivergence | default "0.04" | quote }}
  LATE_ENTRY_SECS:    {{ .Values.bot.lateEntrySecs | default "90" | quote }}
  LATE_ENTRY_EDGE_DISCOUNT: {{ .Values.bot.lateEntryEdgeDiscount | default "0.30" | quote }}
  DRIFT_A1:           {{ .Values.bot.driftA1 | quote }}
  DRIFT_A2:           {{ .Values.bot.driftA2 | quote }}
  DRIFT_A3:           {{ .Values.bot.driftA3 | quote }}
  DRIFT_A4:           {{ .Values.bot.driftA4 | quote }}
  MARKET_REFRESH_SECS: {{ .Values.bot.marketRefreshSecs | quote }}
  WS_HEARTBEAT_SECS:  {{ .Values.bot.wsHeartbeatSecs | quote }}
  FEED_STALE_SECS:    {{ .Values.bot.feedStaleSecs | quote }}
  # Position management
  EVAL_INTERVAL_MS: {{ .Values.bot.evalIntervalMs | quote }}
  ENTRY_ORDER_MODE: {{ .Values.bot.entryOrderMode | default "market" | quote }}
  ENTRY_MAKER_OFFSET: {{ .Values.bot.entryMakerOffset | default "0.0" | quote }}
  TAKE_PROFIT:        {{ .Values.bot.takeProfit | quote }}
  STOP_LOSS:          {{ .Values.bot.stopLoss | quote }}
  STOP_LOSS_MARKET_LIMIT: {{ .Values.bot.stopLossMarketLimit | default "1" | quote }}
  SL_ARM_DELAY_SECS:    {{ .Values.bot.slArmDelaySecs | default "60" | quote }}
  ULTRA_CHEAP_SL_DELAY_SECS: {{ .Values.bot.ultraCheapSlDelaySecs | default "120" | quote }}
  SL_MIN_ADVERSE_BTC:   {{ .Values.bot.slMinAdverseBtc | default "0.0015" | quote }}
  AVERAGING_MIN_SECONDS_LEFT: {{ .Values.bot.averagingMinSecondsLeft | default "150" | quote }}
  AVERAGING_MAX_BTC_MOVE: {{ .Values.bot.averagingMaxBtcMove | default "0.003" | quote }}
  THESIS_MIN_BTC_DISTANCE: {{ .Values.bot.thesisMinBtcDistance | default "0.002" | quote }}
  ML_ENTRY_BASE_STOP_LOSS: {{ .Values.bot.mlEntryBaseStopLoss | default "0.10" | quote }}
  ML_ENTRY_LATE_STOP_LOSS: {{ .Values.bot.mlEntryLateStopLoss | default "0.08" | quote }}
  ML_ENTRY_LATE_STOP_SECS: {{ .Values.bot.mlEntryLateStopSecs | default "90" | quote }}
  ML_ENTRY_TRAILING_ARM_GAIN: {{ .Values.bot.mlEntryTrailingArmGain | default "0.08" | quote }}
  ML_ENTRY_TRAILING_GAP: {{ .Values.bot.mlEntryTrailingGap | default "0.05" | quote }}
  ML_ENTRY_THESIS_PROFIT_LOCK: {{ .Values.bot.mlEntryThesisProfitLock | default "0.04" | quote }}
  ML_ENTRY_THESIS_FLOOR_MIN: {{ .Values.bot.mlEntryThesisFloorMin | default "0.02" | quote }}
  ML_ENTRY_THESIS_ENTRY_FRACTION: {{ .Values.bot.mlEntryThesisEntryFraction | default "0.35" | quote }}
  ML_ENTRY_LATE_BAR_CUT_SECS: {{ .Values.bot.mlEntryLateBarCutSecs | default "45" | quote }}
  ML_ENTRY_LATE_BAR_POSITIVE_SECS: {{ .Values.bot.mlEntryLateBarPositiveSecs | default "25" | quote }}
  ML_ENTRY_LATE_BAR_POSITIVE_FLOOR: {{ .Values.bot.mlEntryLateBarPositiveFloor | default "0.03" | quote }}
  ML_ENTRY_DOMINANT_EDGE_FLOOR: {{ .Values.bot.mlEntryDominantEdgeFloor | default "0.08" | quote }}
  ML_ENTRY_DOMINANT_ENTRY_FRACTION: {{ .Values.bot.mlEntryDominantEntryFraction | default "0.50" | quote }}
  ML_ENTRY_FORCE_EXIT_SECS: {{ .Values.bot.mlEntryForceExitSecs | default "10" | quote }}
  SIGNAL_EXIT_EDGE:   {{ .Values.bot.signalExitEdge | quote }}
  MIN_EXIT_BID:       {{ .Values.bot.minExitBid | quote }}
  ORDER_REPLACE_GAP:  {{ .Values.bot.orderReplaceGap | quote }}
  AGGRESSIVE_EXIT_SLIPPAGE: {{ .Values.bot.aggressiveExitSlippage | default "0.02" | quote }}
  TRAILING_ARM_GAIN: {{ .Values.bot.trailingArmGain | default "0.20" | quote }}
  TRAILING_STOP_GAP: {{ .Values.bot.trailingStopGap | default "0.03" | quote }}
  # Binance feed + hold-to-expiry
  BINANCE_WS_URL:     {{ .Values.bot.binanceWsUrl | default "wss://stream.binance.com:9443/ws/btcusdt@aggTrade" | quote }}
  BINANCE_STALE_SECS: {{ .Values.bot.binanceStaleSecs | default "5.0" | quote }}
  HOLD_TO_EXPIRY_DEFAULT: {{ .Values.bot.holdToExpiryDefault | default "true" | quote }}
  TAKER_FEE_BPS:      {{ .Values.bot.takerFeeBps | default "0" | quote }}
  # Infrastructure
  POLYGON_RPC_URL:    {{ .Values.bot.polygonRpcUrl | default "https://rpc.ankr.com/polygon" | quote }}
  POLYMARKET_RTDS_WS: {{ .Values.bot.polymarketRtdsWs | quote }}
  POLYMARKET_RTDS_SYMBOL: {{ .Values.bot.polymarketRtdsSymbol | quote }}
  # Training logs
  TRAINING_LOG_PATH:       {{ .Values.bot.trainingLogPath | default "/app/logs/logs-training.jsonl" | quote }}
  TRAINING_EVENT_LOG_PATH: {{ .Values.bot.trainingEventLogPath | default "/app/logs/logs-training-events.jsonl" | quote }}
  # Telegram
  TELEGRAM_TOKEN:   {{ .Values.telegram.token | quote }}
  TELEGRAM_CHAT_ID: {{ .Values.telegram.chatId | quote }}
