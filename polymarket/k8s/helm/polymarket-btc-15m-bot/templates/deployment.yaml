apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "polymarket-btc-15m-bot.name" . }}
  labels:
    {{- include "polymarket-btc-15m-bot.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "polymarket-btc-15m-bot.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "polymarket-btc-15m-bot.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        checksum/script: {{ include (print $.Template.BasePath "/configmap-script.yaml") . | sha256sum }}
    spec:
      {{- if .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      {{- end }}
      containers:
        - name: polymarket-btc-15m
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "/app/scripts/main.py"]
          env:
            - name: PYTHONPATH
              value: /app/scripts
          envFrom:
            - secretRef:
                name: {{ include "polymarket-btc-15m-bot.name" . }}-secret
          volumeMounts:
            - name: script
              mountPath: /app/scripts
            - name: logs
              mountPath: /app/logs
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: script
          configMap:
            name: {{ include "polymarket-btc-15m-bot.name" . }}-script
            items:
              {{- range $path, $_ := .Files.Glob "files/scripts/*.py" }}
              - key: {{ $path | trimPrefix "files/scripts/" | replace "/" "__" }}
                path: {{ $path | trimPrefix "files/scripts/" }}
              {{- end }}
              {{- range $path, $_ := .Files.Glob "files/scripts/**/*.py" }}
              - key: {{ $path | trimPrefix "files/scripts/" | replace "/" "__" }}
                path: {{ $path | trimPrefix "files/scripts/" }}
              {{- end }}
        - name: logs
          emptyDir: {}
