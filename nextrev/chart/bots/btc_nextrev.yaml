# btc-nextrev — next-bar reversal bettor (ldjfgkl archetype, entry <=0.50 only).
# PAPER first; live flip layers the creds overlay via deploy.sh btc live.
botName: btc-nextrev

bot:
  entrypoint: "nextrev.py"
  coin: "btc"
  paperMode: "true"
  dryRun: "true"
  liveTrading: "false"
  loopIntervalSecs: "300"
  trainingEventLogPath: "/app/logs/logs-training-events.jsonl"
  nextrevCap: "0.51"
  nextrevMinLeadBps: "20"
  nextrevArmSecs: "45"
  nextrevFireLo: "5"
  nextrevFireHi: "35"
  nextrevMaxPx: "0.52"
  nextrevNotional: "5"
  nextrevMaxDailyLoss: "20"
  favOrderType: "gtc"
  binanceWsUrl: "wss://stream.binance.com:9443/ws/btcusdt@aggTrade"
  polymarketRtdsSymbol: "btc/usd"

# 2 cores → EIP-712 presigning of both next-bar tokens is instant
resources:
  requests:
    memory: 256Mi
    cpu: 500m
  limits:
    memory: 512Mi
    cpu: "2"

persistence:
  enabled: false
