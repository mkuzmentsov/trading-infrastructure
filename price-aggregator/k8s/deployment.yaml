apiVersion: v1
kind: Namespace
metadata:
  name: market-data
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: price-aggregator
  namespace: market-data
  labels: { app: price-aggregator }
spec:
  replicas: 1
  selector:
    matchLabels: { app: price-aggregator }
  template:
    metadata:
      labels: { app: price-aggregator }
    spec:
      nodeSelector:
        topology.kubernetes.io/region: hel1
      containers:
        - name: price-aggregator
          image: mkuzmentsov/price-aggregator:0.1
          imagePullPolicy: IfNotPresent
          ports:
            - { name: ws, containerPort: 8080 }
          env:
            - { name: SYMBOLS,      value: "btcusdt" }
            - { name: VENUES,       value: "binance" }
            - { name: WS_PORT,      value: "8080" }
            - { name: BROADCAST_MS, value: "100" }
            - { name: DEPTH_LEVELS, value: "10" }
            - { name: LOG_LEVEL,    value: "INFO" }
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests: { memory: 64Mi, cpu: 25m }
            limits:   { memory: 256Mi, cpu: 500m }
---
apiVersion: v1
kind: Service
metadata:
  name: price-aggregator
  namespace: market-data
  labels: { app: price-aggregator }
spec:
  type: ClusterIP
  selector: { app: price-aggregator }
  ports:
    - { name: ws, port: 8080, targetPort: 8080 }
