apiVersion: v1
kind: Service
metadata:
  name: {{ include "freqtrade-bot.name" . }}
  labels:
    {{- include "freqtrade-bot.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "freqtrade-bot.selectorLabels" . | nindent 4 }}
  ports:
    - name: api
      port: 8080
      targetPort: api
      protocol: TCP
