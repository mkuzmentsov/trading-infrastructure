apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "freqtrade-bot.name" . }}
  labels:
    {{- include "freqtrade-bot.labels" . | nindent 4 }}
spec:
  replicas: 1
  # Recreate ensures the old pod stops before the new one starts (SQLite can't be shared)
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "freqtrade-bot.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "freqtrade-bot.selectorLabels" . | nindent 8 }}
      annotations:
        # Trigger pod restart when config or strategy changes
        checksum/config: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        checksum/strategy: {{ include (print $.Template.BasePath "/configmap-strategy.yaml") . | sha256sum }}
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: freqtrade
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - trade
            - --db-url
            - sqlite:///user_data/tradesv3.sqlite
            - --config
            - /freqtrade/user_data/config.json
            - --strategy
            - {{ .Values.strategy }}
          ports:
            - name: api
              containerPort: 8080
              protocol: TCP
          volumeMounts:
            # PVC for SQLite db and position tracking CSVs
            - name: user-data
              mountPath: /freqtrade/user_data
            # config.json overlaid from Secret (subPath keeps rest of PVC intact)
            - name: config
              mountPath: /freqtrade/user_data/config.json
              subPath: config.json
            # Strategy file overlaid from ConfigMap
            - name: strategy
              mountPath: /freqtrade/user_data/strategies/{{ .Values.strategyFileName }}
              subPath: {{ .Values.strategyFileName }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: user-data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "freqtrade-bot.name" . }}-pvc
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: config
          secret:
            secretName: {{ include "freqtrade-bot.name" . }}-config
            items:
              - key: config.json
                path: config.json
        - name: strategy
          configMap:
            name: {{ include "freqtrade-bot.name" . }}-strategy
