# Kubernetes resource name prefix (also used as bot_name in config.json)
botName: freqtrade-bot

image:
  repository: mkuzmentsov/freqtrade-hl
  tag: 0.2
  pullPolicy: IfNotPresent

# Strategy class name passed to --strategy flag
strategy: COPY_HL_LS
# Strategy Python filename mounted into user_data/strategies/
strategyFileName: copy_hl_ls.py

config:
  dryRun: false
  maxOpenTrades: 50
  stakeCurrency: USDC
  stakeAmount: 12
  availableCapital: 1000.0
  tradingMode: futures
  marginMode: isolated
  leverageRatio: 0.5

exchange:
  walletAddress: ""
  privateKey: ""
  # Sub-account address to trade on behalf of (leave empty if trading on the primary account)
  vaultAddress: ""
  # Address of the wallet to copy (copy_hl_ls strategy only)
  walletToCopy: ""

telegram:
  enabled: false
  token: ""
  chatId: ""

api:
  user: freqtrader
  password: ""
  jwtSecretKey: ""

ingress:
  enabled: true
  className: nginx
  # e.g. bot1.yourdomain.com
  host: ""
  tls:
    enabled: false
    secretName: ""

persistence:
  enabled: false
  size: 1Gi
  # Leave empty to use the cluster default (local-path on k3s)
  storageClass: ""

resources:
  requests:
    memory: 256Mi
    cpu: 100m
  limits:
    memory: 512Mi
    cpu: 500m
