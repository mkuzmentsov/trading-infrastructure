- name: Ensure bot stack directory exists
  ansible.builtin.file:
    path: "{{ freqtrade_stack_dir }}/{{ item.key }}"
    state: directory
    owner: "{{ freqtrade_user }}"
    group: "{{ freqtrade_group }}"
    mode: "0755"

- name: Ensure bot user_data directories exist
  ansible.builtin.file:
    path: "{{ freqtrade_stack_dir }}/{{ item.key }}/user_data/{{ sub_item }}"
    state: directory
    owner: "{{ freqtrade_user }}"
    group: "{{ freqtrade_group }}"
    mode: "0755"
  loop:
    - strategies
    - data
    - logs
    - plots
    - hyperopts
    - notebooks
  loop_control:
    loop_var: sub_item

- name: Sync bot templates (configs, strategies, etc.)
  ansible.builtin.template:
    src: "{{ playbook_dir }}/templates/bot_configs/{{ item.value.strategy }}/{{ tmpl_item.path }}"
    dest: "{{ freqtrade_stack_dir }}/{{ item.key }}/user_data/{{ tmpl_item.dest_path }}"
    owner: "{{ freqtrade_user }}"
    group: "{{ freqtrade_group }}"
    mode: "0644"
  with_items:
    - { path: 'config.json.j2', dest_path: 'config.json' }
    - { path: 'strategies/SampleStrategy.py.j2', dest_path: 'strategies/SampleStrategy.py' }
  when: item.value.strategy == 'sample_strategy'
  loop_control:
    loop_var: tmpl_item
  register: bot_config_sample

- name: Sync bot templates for copy_hl
  ansible.builtin.template:
    src: "{{ playbook_dir }}/templates/bot_configs/{{ item.value.strategy }}/{{ tmpl_item.path }}"
    dest: "{{ freqtrade_stack_dir }}/{{ item.key }}/user_data/{{ tmpl_item.dest_path }}"
    owner: "{{ freqtrade_user }}"
    group: "{{ freqtrade_group }}"
    mode: "0644"
  with_items:
    - { path: 'config.json.j2', dest_path: 'config.json' }
    - { path: 'strategies/COPY_HL.py.j2', dest_path: 'strategies/COPY_HL.py' }
    - { path: 'hyperopts/BestHyperOptLoss.py', dest_path: 'hyperopts/BestHyperOptLoss.py' }
    - { path: 'notebooks/strategy_analysis_example.ipynb', dest_path: 'notebooks/strategy_analysis_example.ipynb' }
  when: item.value.strategy == 'copy_hl'
  loop_control:
    loop_var: tmpl_item
  register: bot_config_copy_hl

- name: Sync bot templates for copy_hl_ls
  ansible.builtin.template:
    src: "{{ playbook_dir }}/templates/bot_configs/{{ item.value.strategy }}/{{ tmpl_item.path }}"
    dest: "{{ freqtrade_stack_dir }}/{{ item.key }}/user_data/{{ tmpl_item.dest_path }}"
    owner: "{{ freqtrade_user }}"
    group: "{{ freqtrade_group }}"
    mode: "0644"
  with_items:
    - { path: 'config.json.j2', dest_path: 'config.json' }
    - { path: 'strategies/copy_hl_ls.py.j2', dest_path: 'strategies/copy_hl_ls.py' }
    - { path: 'hyperopts/BestHyperOptLoss.py', dest_path: 'hyperopts/BestHyperOptLoss.py' }
    - { path: 'notebooks/strategy_analysis_example.ipynb', dest_path: 'notebooks/strategy_analysis_example.ipynb' }
  when: item.value.strategy == 'copy_hl_ls'
  loop_control:
    loop_var: tmpl_item
  register: bot_config_copy_hl_ls

- name: Install Freqtrade docker-compose file for bot
  ansible.builtin.template:
    src: "{{ playbook_dir }}/templates/docker-compose.yml.j2"
    dest: "{{ freqtrade_stack_dir }}/{{ item.key }}/docker-compose.yml"
    owner: "{{ freqtrade_user }}"
    group: "{{ freqtrade_group }}"
    mode: "0644"
  register: bot_compose

- name: Pull Freqtrade images for bot
  ansible.builtin.command:
    cmd: docker compose pull --ignore-buildable
    chdir: "{{ freqtrade_stack_dir }}/{{ item.key }}"
  become_user: "{{ freqtrade_user }}"
  register: bot_pull
  changed_when: "'Downloaded newer image' in (bot_pull.stdout ~ bot_pull.stderr) or 'Pull complete' in (bot_pull.stdout ~ bot_pull.stderr)"

- name: Start Freqtrade for bot
  ansible.builtin.command:
    cmd: docker compose up -d
    chdir: "{{ freqtrade_stack_dir }}/{{ item.key }}"
  become_user: "{{ freqtrade_user }}"
  register: bot_up
  changed_when: "'Creating' in (bot_up.stdout ~ bot_up.stderr) or 'Recreating' in (bot_up.stdout ~ bot_up.stderr) or 'Starting' in (bot_up.stdout ~ bot_up.stderr)"
