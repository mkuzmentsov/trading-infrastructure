- name: Ensure Freqtrade stack directory exists
  ansible.builtin.file:
    path: "{{ freqtrade_stack_dir }}"
    state: directory
    owner: "{{ freqtrade_user }}"
    group: "{{ freqtrade_group }}"
    mode: "0755"

- name: Ensure Freqtrade user_data directory exists
  ansible.builtin.file:
    path: "{{ freqtrade_stack_dir }}/user_data"
    state: directory
    owner: "{{ freqtrade_user }}"
    group: "{{ freqtrade_group }}"
    mode: "0755"

- name: Ensure Freqtrade subdirectories exist
  ansible.builtin.file:
    path: "{{ freqtrade_stack_dir }}/user_data/{{ item }}"
    state: directory
    owner: "{{ freqtrade_user }}"
    group: "{{ freqtrade_group }}"
    mode: "0755"
  loop:
    - strategies
    - notebooks
    - hyperopts
    - data
    - backtest_results
    - plot

- name: Install Freqtrade docker-compose file
  ansible.builtin.template:
    src: "{{ playbook_dir }}/templates/docker-compose.yml.j2"
    dest: "{{ freqtrade_stack_dir }}/docker-compose.yml"
    owner: "{{ freqtrade_user }}"
    group: "{{ freqtrade_group }}"
    mode: "0644"

- name: Install Freqtrade config file
  ansible.builtin.template:
    src: "{{ playbook_dir }}/templates/config.json.j2"
    dest: "{{ freqtrade_stack_dir }}/user_data/config.json"
    owner: "{{ freqtrade_user }}"
    group: "{{ freqtrade_group }}"
    mode: "0644"

- name: Install SampleStrategy
  ansible.builtin.template:
    src: "{{ playbook_dir }}/templates/SampleStrategy.py.j2"
    dest: "{{ freqtrade_stack_dir }}/user_data/strategies/SampleStrategy.py"
    owner: "{{ freqtrade_user }}"
    group: "{{ freqtrade_group }}"
    mode: "0644"

- name: Pull Freqtrade images
  ansible.builtin.command:
    cmd: docker compose --project-name "{{ freqtrade_compose_project_name }}" pull
    chdir: "{{ freqtrade_stack_dir }}"
  become_user: "{{ freqtrade_user }}"
  register: freqtrade_compose_pull
  changed_when: >-
    'Downloaded newer image' in (freqtrade_compose_pull.stdout ~ freqtrade_compose_pull.stderr) or
    'Pull complete' in (freqtrade_compose_pull.stdout ~ freqtrade_compose_pull.stderr)

- name: Start Freqtrade with docker compose
  ansible.builtin.command:
    cmd: docker compose --project-name "{{ freqtrade_compose_project_name }}" up -d
    chdir: "{{ freqtrade_stack_dir }}"
  become_user: "{{ freqtrade_user }}"
  register: freqtrade_compose_up
  changed_when: >-
    'Creating' in freqtrade_compose_up.stdout or
    'Recreating' in freqtrade_compose_up.stdout or
    'Starting' in freqtrade_compose_up.stdout
