- name: Stop Freqtrade for decommissioned bot
  ansible.builtin.command:
    cmd: docker compose down
    chdir: "{{ freqtrade_stack_dir }}/{{ bot_name }}"
  become_user: "{{ freqtrade_user }}"
  ignore_errors: true
  register: bot_down

- name: Remove bot directory
  ansible.builtin.file:
    path: "{{ freqtrade_stack_dir }}/{{ bot_name }}"
    state: absent
