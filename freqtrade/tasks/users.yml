- name: Ensure freqtrade group exists
  ansible.builtin.group:
    name: "{{ freqtrade_group }}"
    state: present

- name: Ensure freqtrade user exists
  ansible.builtin.user:
    name: "{{ freqtrade_user }}"
    group: "{{ freqtrade_group }}"
    shell: /bin/bash
    create_home: true
    state: present

- name: Ensure freqtrade home directory permissions
  ansible.builtin.file:
    path: "{{ freqtrade_home }}"
    state: directory
    owner: "{{ freqtrade_user }}"
    group: "{{ freqtrade_group }}"
    mode: "0755"
