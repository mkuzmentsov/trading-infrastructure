# Apply AFTER cert-manager is fully running:
#   kubectl apply -f hetzner-k3s/letsencrypt-issuer.yaml
#
# Verify:
#   kubectl get clusterissuer letsencrypt-prod

apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    # Replace with your email — Let's Encrypt sends expiry warnings here
    email: kuzmentsov@gmail.com
    privateKeySecretRef:
      name: letsencrypt-prod
    solvers:
      - http01:
          ingress:
            ingressClassName: traefik
