# LIVE overlay for btc — apply ON TOP of btc_every_tick.yaml + creds.secret.yaml:
#   ./golive.sh btc  (release btc-every-tick-both, ns every-tick-both)
# Real orders, real money. eth/sol/xrp stay paper until given their own overlay.
bot:
  paperMode: "false"
  liveTrading: "true"          # explicit opt-in — bot hard-errors on ambiguity
  dryRun: "false"
  quoteNotionalUsd: "5"        # $ per bar entry; raise to 10 when ready
  liveMaxOrderUsd: "5"         # hard per-order notional cap
  liveMaxDailyLossUsd: "25"    # daily realized loss -> cancel-all + halt for the UTC day
  liveQuoteWarmupSecs: "0"     # entry on the book at bar roll (latency edge)
  prediscoveryLeadSecs: "30"   # fetch next market T-30s via deterministic slug
  liveReconcileSecs: "30"      # REST open-order reconciliation cadence
