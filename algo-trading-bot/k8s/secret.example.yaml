# Kraken Futures API credentials for the live bot. DO NOT COMMIT THE REAL SECRET.
# Create it directly (keys never touch git):
#
#   kubectl create secret generic atb-kraken-creds -n algo-trading \
#     --from-literal=api_key='YOUR_KRAKEN_FUTURES_API_KEY' \
#     --from-literal=api_secret='YOUR_KRAKEN_FUTURES_API_SECRET'
#
# Use a Kraken Futures API key with TRADE permission only (no withdrawal). Consider a
# position/loss cap on Kraken's side for this $80 test.
apiVersion: v1
kind: Secret
metadata:
  name: atb-kraken-creds
  namespace: algo-trading
type: Opaque
stringData:
  api_key: "REPLACE_ME"
  api_secret: "REPLACE_ME"
