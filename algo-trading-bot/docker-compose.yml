# Run the bot locally for Kraken and/or Hyperliquid.
#
# 1) fetch data once (per venue):
#      docker compose --profile tools run --rm fetch-kraken
#      docker compose --profile tools run --rm fetch-hl
# 2) paper-trade (simulated fills, no keys needed):
#      docker compose up --build paper-kraken paper-hl
#
# `--source replay` (default below) streams stored bars through the real engine so you
# can watch it; switch to `--source live` to tail the venue's live bars (warms up from
# stored history first). State + decision logs persist to ./state (survive restarts).
#
# Credentials (only used by the GUARDED real-money `live` mode) come from ./.env —
# copy .env.example to .env and fill it in. Paper mode ignores them.

services:
  paper-kraken:
    build: .
    image: algo-trading-bot:latest
    env_file: [.env]
    # Live: warm up from stored history, then tail Kraken's live bars (one per hour).
    command: ["paper", "--config", "configs/paper_kraken.toml", "--source", "live",
              "--state-dir", "/app/state"]
    volumes: [./data:/app/data, ./state:/app/state, ./configs:/app/configs]
    restart: unless-stopped

  paper-hl:
    build: .
    image: algo-trading-bot:latest
    env_file: [.env]
    command: ["paper", "--config", "configs/paper_hl.toml", "--source", "live",
              "--state-dir", "/app/state"]
    volumes: [./data:/app/data, ./state:/app/state, ./configs:/app/configs]
    restart: unless-stopped

  # One-shot data fetches (profile `tools` so they don't run on `up`).
  fetch-kraken:
    build: .
    image: algo-trading-bot:latest
    profiles: [tools]
    command: ["fetch", "--venue", "krakenfutures", "--symbols", "BTC", "--interval", "1h",
              "--start", "2026-04-01", "--data-dir", "/app/data"]
    volumes: [./data:/app/data]

  fetch-hl:
    build: .
    image: algo-trading-bot:latest
    profiles: [tools]
    command: ["fetch", "--venue", "hyperliquid", "--symbols", "BTC", "--interval", "1h",
              "--start", "2026-02-18", "--data-dir", "/app/data"]
    volumes: [./data:/app/data]
