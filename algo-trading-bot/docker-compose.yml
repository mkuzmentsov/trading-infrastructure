# Run the bot locally. Two steps:
#   1) fetch data once:   docker compose --profile tools run --rm fetch
#   2) paper-trade:        docker compose up --build paper
#
# `paper` replays stored bars through the real engine with simulated fills (no keys).
# State + decision logs land in ./state; market data in ./data. Both are host-mounted
# so they survive container restarts (NFR4).

services:
  paper:
    build: .
    image: algo-trading-bot:latest
    command: ["paper", "--config", "configs/paper.toml", "--source", "replay",
              "--speed", "2", "--state-dir", "/app/state"]
    volumes:
      - ./data:/app/data
      - ./state:/app/state
      - ./configs:/app/configs
    restart: unless-stopped

  # One-shot data fetch. Enable with the `tools` profile so it doesn't run on `up`.
  fetch:
    build: .
    image: algo-trading-bot:latest
    profiles: ["tools"]
    command: ["fetch", "--venue", "binance", "--symbols", "BTC", "--interval", "1h",
              "--start", "2024-01-01", "--data-dir", "/app/data"]
    volumes:
      - ./data:/app/data
