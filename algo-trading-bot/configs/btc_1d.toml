# Position-horizon trend — BTC daily bars. ema_fast/slow are now in DAYS (20/100-day
# trend), vol_window ~2 months. Lowest cost sensitivity; where trend-following survives.
name = "btc_1d_trend"
horizon = "position"
universe = ["BTC"]
data_venue = "binance"
bar_interval = "1d"
starting_cash = 10000.0
data_dir = "./data"

[venue]
name = "hyperliquid"
testnet = true
max_capital_quote = 10000.0

[trend]
ema_fast = 20
ema_slow = 100
vol_window = 48
scale = 10.0

[friction]
taker_fee_bps = 4.5

[risk]
max_gross_leverage = 2.0
target_annual_vol = 0.20
kelly_fraction = 0.5
drawdown_derisk = 0.10
drawdown_halt = 0.20
min_trade_notional = 10.0
rebalance_deadband = 0.05
