# No-search multi-window sleeved TSM (experiment #9 promoted) — the project's strongest book.
# 2-sleeve cluster sizing + a FIXED a-priori Carver speed blend (no window search -> significance
# is the un-deflated PSR). Long-history panel (Yahoo, 2014+). Set vol_overlay_window to add the
# crash-control overlay (experiment #10).
name = "tstrend_multiwindow_aggr"
horizon = "position"
universe = ["BTC", "ETH", "BNB", "SOL", "XRP", "ADA", "DOGE", "AVAX", "LINK", "DOT", "LTC", "TRX", "ATOM", "BCH", "ETC", "XLM", "SPY", "QQQ", "TLT", "IEF", "GLD", "DBC", "USO", "UUP"]
data_venue = "mixed_long"
bar_interval = "1d"
starting_cash = 10000.0

[venue]
name = "hyperliquid"
testnet = true
max_capital_quote = 10000.0

[trend]
ema_fast = 20
ema_slow = 100
vol_window = 48
scale = 10.0

[xsec]
rebalance = 1

[friction]
taker_fee_bps = 4.5

[risk]
max_gross_leverage = 6.0
target_annual_vol = 0.40

[tstrend]
cov_window = 100
shrinkage = 0.3
windows = [[8, 32], [16, 64], [32, 128], [64, 256]]
vol_overlay_window = 60   # conventional quarter-vol DD-control overlay (a-priori, not searched)

[tstrend.sleeves]
crypto = ["BTC", "ETH", "BNB", "SOL", "XRP", "ADA", "DOGE", "AVAX", "LINK", "DOT", "LTC", "TRX", "ATOM", "BCH", "ETC", "XLM"]
macro = ["SPY", "QQQ", "TLT", "IEF", "GLD", "DBC", "USO", "UUP"]
