# Multi-asset daily time-series trend (managed-futures style). Each asset trades its own
# trend (long up / short down), vol-targeted to equal risk, netted into one book.
name = "tstrend_1d"
horizon = "position"
universe = ["BTC", "ETH", "BNB", "SOL", "XRP", "ADA", "DOGE", "AVAX", "LINK", "DOT", "LTC", "TRX", "ATOM", "BCH", "ETC", "XLM"]
data_venue = "binance"
bar_interval = "1d"
starting_cash = 10000.0

[venue]
name = "hyperliquid"
testnet = true
max_capital_quote = 10000.0

[trend]
ema_fast = 20
ema_slow = 100
vol_window = 48
scale = 10.0

[xsec]
rebalance = 1        # daily rebalance (trend turnover is low anyway)

[friction]
taker_fee_bps = 4.5

[risk]
max_gross_leverage = 2.0
target_annual_vol = 0.20
