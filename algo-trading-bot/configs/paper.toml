# Paper-trading config — BTC 1h trend baseline, simulated fills.
# Runs the SAME engine as backtest/validate (NFR1); fills are simulated, no keys needed.
name = "paper_btc_1h"
horizon = "swing"
universe = ["BTC"]
data_venue = "binance"     # replay source reads stored Binance bars; live source polls it
bar_interval = "1h"
starting_cash = 10000.0
data_dir = "./data"

[venue]
name = "hyperliquid"        # trade venue (only used by real `live` mode, which is guarded)
testnet = true
max_capital_quote = 10000.0

[trend]
ema_fast = 20
ema_slow = 100
vol_window = 48
scale = 10.0

[friction]
taker_fee_bps = 4.5

[risk]
max_gross_leverage = 2.0
target_annual_vol = 0.20
kelly_fraction = 0.5
drawdown_derisk = 0.10
drawdown_halt = 0.20
min_trade_notional = 10.0
rebalance_deadband = 0.05
