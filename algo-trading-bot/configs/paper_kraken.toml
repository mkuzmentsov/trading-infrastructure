# Paper-trading config — Kraken Futures (USD-settled perpetuals), BTC 1h trend, sim fills.
# Perps -> long/short with leverage, matching Hyperliquid. Live `--source live` polls
# Kraken Futures public OHLCV (BTC/USD:USD).
name = "paper_kraken_btc"
horizon = "swing"
universe = ["BTC"]
data_venue = "krakenfutures"
bar_interval = "1h"
starting_cash = 10000.0
data_dir = "./data"

[venue]
name = "krakenfutures"
testnet = true
max_capital_quote = 10000.0

[trend]
ema_fast = 20
ema_slow = 100
vol_window = 48
scale = 10.0

[friction]
taker_fee_bps = 5.0

[risk]
max_gross_leverage = 2.0       # perps: long/short with leverage
target_annual_vol = 0.20
kelly_fraction = 0.5
drawdown_derisk = 0.10
drawdown_halt = 0.20
min_trade_notional = 10.0
rebalance_deadband = 0.05
