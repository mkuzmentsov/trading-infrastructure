# Cross-sectional momentum — alt universe, daily bars (position horizon, §6.0/§6.2).
# Dollar-neutral long-short, so the long-only crypto trend is hedged out by design.
name = "xsec_mom_1d"
horizon = "position"
universe = ["BTC", "ETH", "BNB", "SOL", "XRP", "ADA", "DOGE", "AVAX", "LINK", "DOT", "LTC", "TRX", "ATOM", "BCH", "ETC", "XLM"]
data_venue = "binance"
bar_interval = "1d"
starting_cash = 10000.0

[venue]
name = "hyperliquid"
testnet = true
max_capital_quote = 10000.0

[xsec]
lookback = 30
skip = 0
top_frac = 0.3
rebalance = 7
leverage = 1.0

[friction]
taker_fee_bps = 4.5

[validation]
embargo_pct = 0.01
