# 3-sleeve grouping with JOINT selection (max_joint_trials raised so 9^3=729 <= cap) — isolates
# grouping effect from selection method vs the 6-sleeve (independent) and 2-sleeve (joint) runs.
name = "tstrend_sleeved3"
horizon = "position"
universe = ["BTC", "ETH", "BNB", "SOL", "XRP", "ADA", "DOGE", "AVAX", "LINK", "DOT", "LTC", "TRX", "ATOM", "BCH", "ETC", "XLM", "SPY", "QQQ", "TLT", "IEF", "GLD", "DBC", "USO", "UUP"]
data_venue = "mixed"
bar_interval = "1d"
starting_cash = 10000.0

[venue]
name = "hyperliquid"
testnet = true
max_capital_quote = 10000.0

[trend]
ema_fast = 20
ema_slow = 100
vol_window = 48
scale = 10.0

[xsec]
rebalance = 1

[friction]
taker_fee_bps = 4.5

[risk]
max_gross_leverage = 2.0
target_annual_vol = 0.20

[tstrend]
cov_window = 100
shrinkage = 0.3
max_joint_trials = 1000

[tstrend.sleeves]
crypto = ["BTC", "ETH", "BNB", "SOL", "XRP", "ADA", "DOGE", "AVAX", "LINK", "DOT", "LTC", "TRX", "ATOM", "BCH", "ETC", "XLM"]
financials = ["SPY", "QQQ", "TLT", "IEF"]
real_macro = ["GLD", "DBC", "USO", "UUP"]
