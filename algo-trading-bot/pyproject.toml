[project]
name = "algo-trading-bot"
version = "0.1.0"
description = "Systematic directional crypto trading bot — pattern + ML, backtest==live, validation-first."
requires-python = ">=3.11"
# Core deps kept deliberately light. Heavy/optional stacks live in [project.optional-dependencies]
# so the research + validation path installs fast and the venue/ML stacks are opt-in.
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pydantic>=2.7",
]

[project.optional-dependencies]
# Point-in-time storage (Parquet + DuckDB), per §2.1.
storage = [
    "pyarrow>=16.0",
    "duckdb>=1.0",
]
# Tabular GBTs first, DL deferred — principle #11, §8.
ml = [
    "scikit-learn>=1.5",
    "lightgbm>=4.3",
]
# Venue connectivity. One venue is active at a time (§2.1).
venues = [
    "ccxt>=4.3",                     # Kraken (+ others) via a single interface
    "hyperliquid-python-sdk>=0.24",  # native HL
    "eth-account>=0.11",             # HL signing
]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
atb = "algo_trading_bot.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/algo_trading_bot"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
