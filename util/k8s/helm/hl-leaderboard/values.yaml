image:
  repository: python
  tag: "3.12-slim"
  pullPolicy: IfNotPresent

# Cron schedule — runs at midnight UTC
schedule: "0 0 * * *"

# Extra args passed to hl_leaderboard.py
leaderboardArgs: "--top 20 --min-account 10000 --min-age-days 180"

telegram:
  token: ""
  chatId: ""

# Wallets of interest — one address per line (comments with # supported)
walletsOfInterest: ""

resources:
  requests:
    memory: 256Mi
    cpu: 100m
  limits:
    memory: 512Mi
    cpu: 500m
