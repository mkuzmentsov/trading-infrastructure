apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "hl-leaderboard.name" . }}-scripts
  labels:
    {{- include "hl-leaderboard.labels" . | nindent 4 }}
data:
  run.sh: |
{{ .Files.Get "files/run.sh" | indent 4 }}
  hl_leaderboard.py: |
{{ .Files.Get "files/hl_leaderboard.py" | indent 4 }}
  wallets-of-interest.txt: |
{{ .Values.walletsOfInterest | indent 4 }}
