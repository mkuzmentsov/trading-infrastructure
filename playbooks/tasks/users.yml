- name: Ensure hummingbot group exists
  ansible.builtin.group:
    name: "{{ hummingbot_group }}"
    state: present

- name: Ensure hummingbot user exists
  ansible.builtin.user:
    name: "{{ hummingbot_user }}"
    group: "{{ hummingbot_group }}"
    shell: /bin/bash
    create_home: true
    state: present

- name: Ensure hummingbot home directory permissions
  ansible.builtin.file:
    path: "{{ hummingbot_home }}"
    state: directory
    owner: "{{ hummingbot_user }}"
    group: "{{ hummingbot_group }}"
    mode: "0755"
