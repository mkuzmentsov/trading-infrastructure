# TEMPLATE ONLY — do not commit real values. The live Secret is created
# out-of-band so credentials never land in git:
#
#   kubectl create secret generic trading-mcp-secret -n trading-mcp \
#     --from-literal=MCP_AUTH_TOKEN='<long-random-token>' \
#     --from-literal=KRAKEN_API_KEY='...' \
#     --from-literal=KRAKEN_API_SECRET='...' \
#     --from-literal=HYPERLIQUID_ACCOUNT_ADDRESS='0x...' \
#     --from-literal=HYPERLIQUID_API_PRIVATE_KEY='0x...' \
#     --from-literal=BINANCE_API_KEY='...' \
#     --from-literal=BINANCE_API_SECRET='...' \
#     --from-literal=WHITEBIT_API_KEY='...' \
#     --from-literal=WHITEBIT_API_SECRET='...'
#
# Leave a venue's keys out to skip registering that exchange. Only MCP_AUTH_TOKEN
# is required (it gates the public endpoint).
apiVersion: v1
kind: Secret
metadata:
  name: trading-mcp-secret
  namespace: trading-mcp
type: Opaque
stringData:
  MCP_AUTH_TOKEN: "REPLACE_ME"
  KRAKEN_API_KEY: ""
  KRAKEN_API_SECRET: ""
  HYPERLIQUID_ACCOUNT_ADDRESS: ""
  HYPERLIQUID_API_PRIVATE_KEY: ""
  HYPERLIQUID_VAULT_ADDRESS: ""
  BINANCE_API_KEY: ""
  BINANCE_API_SECRET: ""
  WHITEBIT_API_KEY: ""
  WHITEBIT_API_SECRET: ""
