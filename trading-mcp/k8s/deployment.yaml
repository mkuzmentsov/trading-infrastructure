apiVersion: apps/v1
kind: Deployment
metadata:
  name: trading-mcp
  namespace: trading-mcp
  labels:
    app: trading-mcp
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: trading-mcp
  template:
    metadata:
      labels:
        app: trading-mcp
    spec:
      # Pinned to a specific node because the egress IP is per-node and every
      # IP-bound API key is tied to it. Do NOT let the pod drift on restarts.
      #
      # 2026-07-29: moved nbg1 (worker1, egress 168.119.167.215) -> hel1
      # (finland-worker2, egress 62.238.0.110). Polymarket geoblocks German and
      # US IPs on POST /order, so from nbg1 every order returned
      #   403 "Trading restricted in your region"
      # while the bot pods, already on hel1, placed fine. Reads were unaffected,
      # which is why this went unnoticed.
      #
      # TRADE-OFF, deliberate: the exchange keys (Binance/Kraken/Bybit/…) are
      # still whitelisted to the OLD nbg1 IP, so those tools will fail auth
      # until 62.238.0.110 is added to each venue's API-key whitelist. Accepted
      # by the user 2026-07-29 — Polymarket ops first, whitelist on demand.
      nodeSelector:
        kubernetes.io/hostname: hetzner-k3s-cluster-pool-workers-finland-worker2
      containers:
        - name: trading-mcp
          image: mkuzmentsov/trading-mcp:0.14
          # IfNotPresent: 0.12 was imported directly into the node's containerd
          # (docker-hub push stalled); a hub push later makes Always safe again.
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8765
          env:
            - name: MCP_TRANSPORT
              value: streamable-http
            - name: MCP_HOST
              value: "0.0.0.0"
            - name: MCP_PORT
              value: "8765"
            - name: LOG_LEVEL
              value: INFO
            - name: MCP_ALLOWED_HOSTS
              value: mcp.kuzmentsov.com
          # All secrets (MCP_AUTH_TOKEN + every venue's API keys) come from the
          # Secret created out-of-band via `kubectl create secret` — never committed.
          envFrom:
            - secretRef:
                name: trading-mcp-secret
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
