apiVersion: apps/v1
kind: Deployment
metadata:
  name: trading-mcp
  namespace: trading-mcp
  labels:
    app: trading-mcp
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: trading-mcp
  template:
    metadata:
      labels:
        app: trading-mcp
    spec:
      containers:
        - name: trading-mcp
          image: mkuzmentsov/trading-mcp:0.11
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8765
          env:
            - name: MCP_TRANSPORT
              value: streamable-http
            - name: MCP_HOST
              value: "0.0.0.0"
            - name: MCP_PORT
              value: "8765"
            - name: LOG_LEVEL
              value: INFO
            - name: MCP_ALLOWED_HOSTS
              value: mcp.kuzmentsov.com
          # All secrets (MCP_AUTH_TOKEN + every venue's API keys) come from the
          # Secret created out-of-band via `kubectl create secret` — never committed.
          envFrom:
            - secretRef:
                name: trading-mcp-secret
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
