apiVersion: apps/v1
kind: Deployment
metadata:
  name: trading-mcp
  namespace: trading-mcp
  labels:
    app: trading-mcp
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: trading-mcp
  template:
    metadata:
      labels:
        app: trading-mcp
    spec:
      # Pin to the exchange-IP-whitelisted worker (Binance/Kraken/Bybit keys are
      # bound to this node's egress IP). Do NOT let the pod drift on restarts.
      nodeSelector:
        kubernetes.io/hostname: hetzner-k3s-cluster-pool-workers-worker1
      containers:
        - name: trading-mcp
          image: mkuzmentsov/trading-mcp:0.14
          # IfNotPresent: 0.12 was imported directly into the node's containerd
          # (docker-hub push stalled); a hub push later makes Always safe again.
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8765
          env:
            - name: MCP_TRANSPORT
              value: streamable-http
            - name: MCP_HOST
              value: "0.0.0.0"
            - name: MCP_PORT
              value: "8765"
            - name: LOG_LEVEL
              value: INFO
            - name: MCP_ALLOWED_HOSTS
              value: mcp.kuzmentsov.com
          # All secrets (MCP_AUTH_TOKEN + every venue's API keys) come from the
          # Secret created out-of-band via `kubectl create secret` — never committed.
          envFrom:
            - secretRef:
                name: trading-mcp-secret
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
