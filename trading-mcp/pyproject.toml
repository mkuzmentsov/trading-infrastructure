[project]
name = "trading-mcp"
version = "0.1.0"
description = "Multi-exchange MCP server (Binance, Kraken, Hyperliquid, WhiteBIT, ...)"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]==1.27.1",
    "python-binance>=1.0.27",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "hyperliquid-python-sdk>=0.24.0",
    "eth-account>=0.11.0",
    "py-clob-client-v2==1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trading_mcp"]

[project.scripts]
trading-mcp = "trading_mcp.__main__:main"
