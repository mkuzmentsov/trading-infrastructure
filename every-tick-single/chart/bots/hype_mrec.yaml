# hype-mrec — recorders fleet: 100ms multi-market recorder (cur-until-RESOLVED +
# next 3 pre-open bars, slug-tagged rows). Sole event source; bots log minimal.
botName: hype-mrec
bot:
  entrypoint: "multi_recorder.py"
  coin: "hype"
  paperMode: "true"
  dryRun: "true"
  liveTrading: "false"
  loopIntervalSecs: "300"
  snapshotMs: "100"
  mrecAhead: "3"
  rawLogDir: "/app/logs/raw"
  retentionDays: "7"
  binanceWsUrl: "wss://stream.binance.com:9443/ws/hypeusdt@aggTrade"
  polymarketRtdsSymbol: "hype/usd"
  hrecCoin: "HYPE"
  hrecSubs: "bbo,trades,l2Book,activeAssetCtx,candle"

persistence:
  enabled: true
  size: 20Gi
