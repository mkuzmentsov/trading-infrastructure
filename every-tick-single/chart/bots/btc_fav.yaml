# btc-fav — near-locked-favorite TAKER experiment (entrypoint fav_taker.py).
# Buys the favorite side of the live 5m bar when the CLOB ask lags the true
# (near-1) probability estimated from the intra-bar move vs volatility.
# Committed defaults are PAPER/DRY. Go live with the sol.secret.yaml overlay:
#   helm upgrade --install btc-fav-every-tick-single ./chart \
#     -f chart/bots/btc_fav.yaml -f chart/bots/sol.secret.yaml -n every-tick-single
botName: btc-fav

bot:
  entrypoint: "fav_taker.py"
  coin: "btc"
  # PAPER by default — real orders need liveTrading=true + dryRun=false (overlay)
  paperMode: "true"
  dryRun: "true"
  liveTrading: "false"
  # caps
  liveMaxOrderUsd: "5"
  liveMaxDailyLossUsd: "50"
  quoteNotionalUsd: "5"
  loopIntervalSecs: "300"
  trainingEventLogPath: "/app/logs/logs-training-events.jsonl"
  # decision gates (env -> fav_taker.py); tune during testing
  favMinPrice: "0.80"
  favMaxPrice: "0.97"
  favMinTrue: "0.90"
  favMinEdge: "0.03"
  favMinTleft: "15"
  favMaxTleft: "180"
