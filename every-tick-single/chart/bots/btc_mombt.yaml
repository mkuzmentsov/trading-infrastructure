# btc-mombt — A/B twin of btc-mom: identical gates, but the Binance
# signal feed is the FUTURES bookTicker mid (fstream, denser + leads spot)
# instead of spot aggTrade. Paper. Compare EXEC_HB delay + EV vs the twin.
botName: btc-mombt

bot:
  entrypoint: "fav_taker.py"
  coin: "btc"
  binanceWsUrl: "wss://fstream.binance.com/ws/btcusdt@bookTicker"
  # PAPER by default — real orders need liveTrading=true + dryRun=false (overlay)
  paperMode: "true"
  dryRun: "true"
  liveTrading: "false"
  # caps
  liveMaxOrderUsd: "5"
  liveMaxDailyLossUsd: "50"
  quoteNotionalUsd: "5"
  loopIntervalSecs: "300"
  trainingEventLogPath: "/app/logs/logs-training-events.jsonl"
  # decision gates (env -> fav_taker.py); tune during testing
  favMinPrice: "0.80"
  favMaxPrice: "0.94"
  favMinTrue: "0.90"
  favMinEdge: "0.03"
  favMinTleft: "15"
  favMaxTleft: "180"
  favMinLeadBps: "4"
  favPockets: '[{"p_lo": 0.5, "p_hi": 0.7, "tl_lo": 60, "tl_hi": 270, "edge": 0.03, "true": 0.0, "mom": 1}]'
  favTakerFeeRate: "0.10"

