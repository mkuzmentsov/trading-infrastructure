# doge-tailv2 — 5m tail with 2251-bet analysis gates (PAPER, A/B vs doge-tail):
# p_hi 0.06 (7-8c entries lost -$1130), tl_hi 20 (25-30s lost -$982),
# true_hi 0.45 (model anti-predictive at high conf, -$347), mom dead-zone
# skip 0.0-1.0 (-$772; >1.0 snap-back +$717). Same $5, PVC on.
botName: doge-tailv2

bot:
  entrypoint: "fav_taker.py"
  coin: "doge"
  paperMode: "true"
  dryRun: "true"
  liveTrading: "false"
  liveMaxOrderUsd: "5"
  liveMaxDailyLossUsd: "99999"
  quoteNotionalUsd: "5"
  loopIntervalSecs: "300"
  trainingEventLogPath: "/app/logs/logs-training-events.jsonl"
  favPockets: '[{"p_lo": 0.01, "p_hi": 0.06, "tl_lo": 5, "tl_hi": 20, "edge": 0.05, "true": 0.0, "true_hi": 0.45, "mom_skip_lo": 0.0, "mom_skip_hi": 1.0, "mom": 0}]'
  favMinLeadBps: "0"
  favTakerFeeRate: "0.10"

