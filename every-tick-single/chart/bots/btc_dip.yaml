# btc-dip — fixed-price dip-catcher (PAPER). Leaderboard archetype 0xb29e5247
# ($12.6k/wk): rest maker BUYs on BOTH sides at exactly 0.20 all bar, fee-free;
# panic dumps print through 0.20 and pay 5:1 when the side recovers. No model,
# no momentum brake — violent moves ARE the trade. High variance by design.
# Install: helm upgrade --install btc-dip-every-tick-single ./chart \
#   -f chart/bots/btc_dip.yaml -n every-tick-single
botName: btc-dip

bot:
  coin: "btc"
  strategyName: "maker_rebate"
  paperMode: "true"
  dryRun: "true"
  liveTrading: "false"
  quoteMode: "fixed"
  quoteFixedPrice: "0.20"
  quoteFloor: "0.05"
  quoteCeil: "0.90"
  quoteSize: "5"
  quoteWarmupSecs: "15"
  quoteCutoffSecs: "30"
  minPairEdge: "0.06"
  repriceTicks: "0.01"
  repriceZ: "1.5"
  # let it accumulate a real dump (archetype does ~$4k/bar; we measure at $20/bar)
  maxInventoryShares: "100"
  makerFeeRate: "0.0"
  loopIntervalSecs: "300"
  evalIntervalMs: "200"
  evalMinGapMs: "100"
  quoteNotionalUsd: "5"
  liveMaxOrderUsd: "5"
  liveMaxDailyLossUsd: "25"
  trainingEventLogPath: "/app/logs/logs-training-events.jsonl"
  binanceWsUrl: "wss://stream.binance.com:9443/ws/btcusdt@aggTrade"
  polymarketRtdsSymbol: "btc/usd"

