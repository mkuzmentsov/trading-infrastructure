# btc-pcprobe — POST-CLOSE settlement-window recorder (measurement probe).
# Standalone ws_recorder.py with POST_CLOSE_GRACE_SECS=15: keeps the CLOSING
# market's book streaming 15s past bar-end so we capture the resolution-delay
# window (t_left<0) where stale winner sell-orders linger — the window the
# consistent 5m earners snipe. Public book only, no creds, no trading.
# Trade-off: the next bar's first 15s are not recorded (roll delayed).
# Install: helm upgrade --install btc-pcprobe-every-tick-single ./chart \
#   -f chart/bots/btc_pcprobe.yaml -n every-tick-single
botName: btc-pcprobe

bot:
  entrypoint: "ws_recorder.py"
  coin: "btc"
  paperMode: "true"
  dryRun: "true"
  liveTrading: "false"
  loopIntervalSecs: "300"
  snapshotMs: "100"
  rawLogDir: "/app/logs/raw"
  retentionDays: "3"
  postCloseGraceSecs: "15"
  binanceWsUrl: "wss://stream.binance.com:9443/ws/btcusdt@aggTrade"
  polymarketRtdsSymbol: "btc/usd"
