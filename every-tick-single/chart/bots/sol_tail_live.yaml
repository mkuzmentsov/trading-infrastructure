# sol-tail-live — LIVE tail sniper, separate from the paper btc-tail.
# Purpose: measure REAL fill quality at 3-8c asks (thin levels; FAK may
# partial-fill or slip) against the paper twin running the same gates.
# Paper record at go-live (2026-07-16): 43 bets, 11.6% win vs 5.7% breakeven, lowest tail DD ($46).
# Requires the credentials overlay (NEVER commit it):
#   helm upgrade --install sol-tail-live-every-tick-single ./chart \
#     -f chart/bots/sol.secret.yaml -f chart/bots/sol_tail_live.yaml \
#     -n every-tick-single
botName: sol-tail-live

bot:
  entrypoint: "fav_taker.py"
  coin: "sol"
  # live mode comes from the secret overlay (liveTrading/dryRun/paperMode);
  # restated here so this file is ordering-proof:
  liveTrading: "true"
  paperMode: "false"
  dryRun: "false"
  # tighter caps than the overlay defaults — tiny measurement deployment
  liveMaxOrderUsd: "5"
  liveMaxDailyLossUsd: "100"
  quoteNotionalUsd: "5"
  loopIntervalSecs: "300"
  trainingEventLogPath: "/app/logs/logs-training-events.jsonl"
  favPockets: '[{"p_lo": 0.01, "p_hi": 0.10, "tl_lo": 5, "tl_hi": 30, "edge": 0.05, "true": 0.0, "mom": 0}]'
  favMinLeadBps: "0"
  favTakerFeeRate: "0.10"
