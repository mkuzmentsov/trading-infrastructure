# doge-fav — near-locked-favorite TAKER experiment (entrypoint fav_taker.py).
# Buys the favorite side of the live 5m bar when the CLOB ask lags the true
# (near-1) probability estimated from the intra-bar move vs volatility.
# Committed defaults are PAPER/DRY. Go live with the scout.secret.yaml overlay:
#   helm upgrade --install doge-fav-every-tick-single ./chart \
#     -f chart/bots/doge_fav.yaml -f chart/bots/scout.secret.yaml -n every-tick-single
botName: doge-fav

bot:
  entrypoint: "fav_taker.py"
  coin: "doge"
  # PAPER by default — real orders need liveTrading=true + dryRun=false (overlay)
  paperMode: "true"
  dryRun: "true"
  liveTrading: "false"
  # caps
  liveMaxOrderUsd: "5"
  liveMaxDailyLossUsd: "50"
  quoteNotionalUsd: "5"
  loopIntervalSecs: "300"
  trainingEventLogPath: "/app/logs/logs-training-events.jsonl"
  # decision gates (env -> fav_taker.py); tune during testing
  favMinPrice: "0.80"
  favMaxPrice: "0.94"
  favMinTrue: "0.90"
  favMinEdge: "0.03"
  favMinTleft: "15"
  favMaxTleft: "180"
  favMinLeadBps: "4"
  favPockets: '[{"p_lo": 0.78, "p_hi": 0.9, "tl_lo": 10, "tl_hi": 120, "edge": 0.03, "true": 0.0, "mom": 0}, {"p_lo": 0.62, "p_hi": 0.78, "tl_lo": 10, "tl_hi": 60, "edge": 0.04, "true": 0.0, "mom": 0}]'
  favTakerFeeRate: "0.10"
