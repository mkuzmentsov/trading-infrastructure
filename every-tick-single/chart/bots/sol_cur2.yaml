# sol-cur2 — cur+2 50c bettor experiment (entrypoint cur2_bettor.py, NOT the maker
# engine). Predicts the cur+2 SOL bar and rests a 0.50 BUY on the predicted side.
# Committed defaults are DRY (no real orders). Go live with the sol.secret.yaml overlay:
#   helm upgrade --install sol-cur2-every-tick-single ./chart \
#     -f chart/bots/sol_cur2.yaml -f chart/bots/sol.secret.yaml -n every-tick-single
botName: sol-cur2

bot:
  entrypoint: "cur2_bettor.py"
  coin: "sol"
  # DRY by default — real orders need liveTrading=true + dryRun=false (from the overlay)
  paperMode: "true"
  dryRun: "true"
  liveTrading: "false"
  # caps (overlay can tighten/confirm)
  liveMaxOrderUsd: "5"
  liveMaxDailyLossUsd: "50"
  quoteNotionalUsd: "5"
  loopIntervalSecs: "300"
  trainingEventLogPath: "/app/logs/logs-training-events.jsonl"
