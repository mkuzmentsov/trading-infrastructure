# xrp-rec — full-state 100ms WS snapshot recorder (ws_recorder.py).
# Records both-side CLOB book (BBO + tail ladders), Binance price, trade prints,
# and derived signals (lead/z/fav_true/mom_z/sigma) every 100ms while a bar is
# live → /app/logs/raw/xrp-YYYYMMDD-HH.jsonl(.gz), 7-day rolling. A universal
# replay dataset for ANY strat backtest. ~0.45 GB/day/coin raw, ~45 MB/day gz.
botName: xrp-rec

bot:
  entrypoint: "ws_recorder.py"
  coin: "xrp"
  paperMode: "true"
  dryRun: "true"
  liveTrading: "false"
  barSeconds: "300"
  snapshotMs: "100"
  rawLogDir: "/app/logs/raw"
  retentionDays: "7"
  loopIntervalSecs: "300"
