# doge-lock — model-priced two-sided maker ("lock accumulator", PAPER).
# Leaderboard archetype (hot-garbage et al.): rest maker BUYs on BOTH sides all
# bar at fair_p(side) − margin; taker flow crossing fair value fills us fee-free;
# both-side fills lock ≥2×margin, one-sided inventory carries +margin model EV.
# Install: helm upgrade --install doge-lock-every-tick-single ./chart \
#   -f chart/bots/doge_lock.yaml -n every-tick-single
botName: doge-lock

bot:
  coin: "doge"
  strategyName: "maker_rebate"
  paperMode: "true"
  dryRun: "true"
  liveTrading: "false"
  quoteMode: "model"
  quoteModelMargin: "0.04"
  quoteFloor: "0.05"
  quoteCeil: "0.90"
  quoteSize: "5"
  quoteWarmupSecs: "15"
  quoteCutoffSecs: "30"
  minPairEdge: "0.06"
  lockMomBrakeZ: "1.3"
  lockAsymMomZ: "0.7"
  lockAsymExtra: "0.04"
  lockCompletionMargin: "0.01"
  lockPairTarget: "0.96"
  repriceTicks: "0.01"
  repriceZ: "1.5"
  maxInventoryShares: "30"
  makerFeeRate: "0.0"
  loopIntervalSecs: "300"
  evalIntervalMs: "200"
  evalMinGapMs: "100"
  quoteNotionalUsd: "5"
  liveMaxOrderUsd: "5"
  liveMaxDailyLossUsd: "25"
  trainingEventLogPath: "/app/logs/logs-training-events.jsonl"
  binanceWsUrl: "wss://stream.binance.com:9443/ws/dogeusdt@aggTrade"
  polymarketRtdsSymbol: "doge/usd"
