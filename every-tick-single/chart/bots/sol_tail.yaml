# btc-tail — late-bar extremes sniper (PAPER). Leaderboard archetype 0xee65685d
# ($13.3k/wk, btc leg of the archetype): in the last ~30s, buy the
# "dead" side at 0.01-0.08 when the model says it is still alive (net edge
# >= 5c). Knife-edge bars are the target -> favMinLeadBps=0 (no lead floor).
# Fires on the UNDERDOG side (both-sides pocket evaluation in fav_taker).
# Install: helm upgrade --install btc-tail-every-tick-single ./chart \
#   -f chart/bots/btc_tail.yaml -n every-tick-single
botName: sol-tail

bot:
  entrypoint: "fav_taker.py"
  coin: "sol"
  paperMode: "true"
  dryRun: "true"
  liveTrading: "false"
  liveMaxOrderUsd: "5"
  liveMaxDailyLossUsd: "99999"
  quoteNotionalUsd: "5"
  loopIntervalSecs: "300"
  trainingEventLogPath: "/app/logs/logs-training-events.jsonl"
  favPockets: '[{"p_lo": 0.01, "p_hi": 0.08, "tl_lo": 5, "tl_hi": 30, "edge": 0.05, "true": 0.0, "mom": 0}]'
  favMinLeadBps: "0"
  favTakerFeeRate: "0.10"
  recordSnapshots: "false"

