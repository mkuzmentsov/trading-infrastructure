# sol-tail1h — hourly-bar twin of sol-tail (PAPER): identical pockets on
# the sol up-or-down hourly markets (24 bars/day, name-based ET slugs).
botName: sol-tail1h

bot:
  entrypoint: "fav_taker.py"
  coin: "sol"
  barSeconds: "3600"
  paperMode: "true"
  dryRun: "true"
  liveTrading: "false"
  liveMaxOrderUsd: "5"
  liveMaxDailyLossUsd: "99999"
  quoteNotionalUsd: "5"
  loopIntervalSecs: "300"
  trainingEventLogPath: "/app/logs/logs-training-events.jsonl"
  favPockets: '[{"p_lo": 0.01, "p_hi": 0.08, "tl_lo": 5, "tl_hi": 30, "edge": 0.05, "true": 0.0, "mom": 0}]'
  favMinLeadBps: "0"
  favTakerFeeRate: "0.10"

