# doge-cur2fix — cur+2 bettor (debias + conviction gate) for DOGE. Model = best OOS
# of the fleet (53.3% @gate 0.03). PAPER by default — no real orders.
#   helm upgrade --install doge-cur2fix-every-tick-single ./chart \
#     -f chart/bots/doge_cur2fix.yaml -n every-tick-single
botName: doge-cur2fix
bot:
  entrypoint: "cur2_bettor.py"
  coin: "doge"
  paperMode: "true"
  dryRun: "true"
  liveTrading: "false"
  liveMaxOrderUsd: "5"
  liveMaxDailyLossUsd: "50"
  quoteNotionalUsd: "5"
  loopIntervalSecs: "300"
  trainingEventLogPath: "/app/logs/logs-training-events.jsonl"
  cur2Debias: "true"
  cur2MinConviction: "0.02"
  cur2CenterWindow: "288"
