botName: polymarket-btc-5m-bot

image:
  # Deps-only image (same as the old polymarket bot): code is NOT baked in —
  # deploy.sh syncs src/ -> chart/files/scripts/ and helm injects it as a
  # ConfigMap mounted over /app/scripts. Code changes = helm upgrade, no build.
  repository: mkuzmentsov/pm-btc-bot
  tag: "0.8"
  pullPolicy: IfNotPresent

bot:
  appLogLevel: "INFO"
  dryRun: "true"
  loopIntervalSecs: "300"   # bar length (5m) — NOT the tick rate; ticks = evalIntervalMs
  coin: "btc"               # gamma slug: {coin}-updown-5m-{ts}; keep feeds below consistent
  # ── Paper mode / maker-rebate quoting (see PLAN.md) ────────────────────────
  paperMode: "true"          # maker_rebate simulates quotes; no CLOB calls
  entryStyle: "fixed"        # rest AT entryPriceCap (clamp ask−tick, always maker), no repricing; "chase" = old mid-follow
  bracketSides: "one"        # this project is the single-side experiment
  quoteHalfSpread: "0.02"    # bid = mid − halfSpread
  quoteFloor: "0.45"         # skip the bar if the maker-clamped entry lands below (cheap fills measured q−p<0)
  quoteCeil: "0.70"
  quoteSize: "10"            # shares per quote (legacy fallback when quoteNotionalUsd=0)
  # USD entry budget per bar (bracket, paper AND live): shares = notional/price
  # floored to whole shares, clamped UP to the market's orderMinSize (5).
  # Start 5, raise to 10 when ready — values-only change, no code change.
  quoteNotionalUsd: "5"
  quoteCutoffSecs: "0"       # 0 = never pull the entry; it rests until filled or the bar resolves
  quoteWarmupSecs: "0"       # quote immediately at bar open
  minPairEdge: "0.01"        # up_q + down_q < 1 − minPairEdge (locked-pair profit)
  repriceTicks: "0.01"       # cancel/replace when desired quote drifts more
  repriceZ: "1.5"            # cancel/replace on spot z-move since placement
  maxInventoryShares: "50"   # per side per bar
  makerFeeRate: "0.07"       # crypto taker feeRate — rebate weight = sz*fee*p*(1−p)
  paperTradeFeedTimeoutSecs: "600"  # trade feed silent this long → book-cross fills
  # ── LIVE trading (maker_rebate real-order path) — OFF here; fleet stays paper ──
  # To go live, set ALL of the following in a per-bot values file (never here):
  # the bot hard-errors on any ambiguous combination (e.g. paperMode+liveTrading,
  # liveTrading+dryRun, or missing credentials).
  # liveTrading: "true"          # explicit opt-in — REAL orders, REAL money
  # paperMode: "false"
  # dryRun: "false"
  # liveMaxOrderUsd: "5"         # hard per-order notional cap
  # liveMaxDailyLossUsd: "25"    # daily realized loss → cancel all + halt for the UTC day
  # liveQuoteWarmupSecs: "0"     # live default: entry on the book at bar roll (latency edge)
  # prediscoveryLeadSecs: "30"   # fetch next bar's market T−30s (deterministic gamma slug)
  # liveReconcileSecs: "30"      # REST open-order reconciliation fallback cadence
  # quoteNotionalUsd: "5"        # USD entry budget — start 5, raise to 10 when ready
  # ── Latency arb signal ──────────────────────────────────────────────────────
  minEdge: "0.04"          # edge = fair_p - ask_price - fee (no round-trip cost with hold-to-expiry)
  kellyScale: "0.5"
  betSizeMin: "0.50"
  betSizeMax: "5.00"
  maxBudgetFraction: "0.10"
  takerFeeBps: "0"         # Polymarket taker fee in basis points
  entryMinSecondsLeft: "30"   # enter late — higher certainty, real latency arb
  maxEntrySpread: "0.04"      # slightly wider tolerance
  minEntryPrice: "0.05"
  maxEntryPrice: "0.60"       # wider band — hold-to-expiry captures full 1.00 payout
  strategyName: "latency_arb_hold"
  modelProbFloor: "0.05"      # wider probability range (was 0.12)
  modelProbCeil: "0.95"       # wider probability range (was 0.88)
  mlBlendWeight: "0.50"
  minPositionShares: "6"
  entryConfirmationTicks: "1"  # react fast — latency is the edge
  filterContrarianEntries: "false"
  contrarianTailMaxPrice: "0.25"
  contrarianMoveFilter: "0.0015"
  minBtcDistance: "0.0004"
  minBookDivergence: "0.04"
  lateEntrySecs: "90"
  lateEntryEdgeDiscount: "0.30"
  driftA3: "0.0003"
  # ── Binance feed + hold-to-expiry ──────────────────────────────────────────
  binanceWsUrl: "wss://stream.binance.com:9443/ws/btcusdt@aggTrade"
  binanceStaleSecs: "5.0"
  holdToExpiryDefault: "true"  # hold positions until bar resolves (1.00 or 0.00)
  # ── Position management (mostly bypassed with hold-to-expiry) ──────────────
  evalIntervalMs: "1000"
  entryMakerOffset: "0.0"     # taker entry — speed matters for latency arb
  takeProfit: "0.15"
  stopLoss: "0.08"
  stopLossMarketLimit: "1"
  slArmDelaySecs: "60"
  ultraCheapSlDelaySecs: "120"
  slMinAdverseBtc: "0.0015"
  thesisMinBtcDistance: "0.002"
  minExitBid: "0.03"
  orderReplaceGap: "0.05"
  aggressiveExitSlippage: "0.02"
  trailingArmGain: "0.20"
  trailingStopGap: "0.03"
  # ── Misc ───────────────────────────────────────────────────────────────────
  polygonRpcUrl: "https://rpc.ankr.com/polygon"
  polymarketRtdsWs: "wss://ws-live-data.polymarket.com"
  polymarketRtdsSymbol: "btc/usd"
  trainingLogPath: "/app/logs/logs-training.jsonl"
  trainingEventLogPath: "/app/logs/logs-training-events.jsonl"
  wsHeartbeatSecs: "30"
  feedStaleSecs: "20"

credentials:
  polymarketPrivateKey: ""
  polymarketAddress: ""
  polymarketApiKey: ""
  polymarketApiSecret: ""
  polymarketApiPassphrase: ""
  polymarketSignatureType: "0"   # 0=EOA, 2=Gnosis Safe
  polymarketFunder: ""

telegram:
  token: ""
  chatId: ""

persistence:
  enabled: true      # logs survive pod restarts (rotation keeps 30 days ~1-2GB)
  size: 5Gi

nodeSelector:
  topology.kubernetes.io/region: hel1

resources:
  requests:
    memory: 128Mi
    cpu: 50m
  limits:
    memory: 512Mi
    cpu: 2000m
