apiVersion: v1
kind: Secret
metadata:
  name: {{ include "polymarket-btc-5m-bot.name" . }}-secret
  labels:
    {{- include "polymarket-btc-5m-bot.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Polymarket credentials
  POLYMARKET_PK:               {{ .Values.credentials.polymarketPrivateKey | quote }}
  POLYMARKET_ADDRESS:          {{ .Values.credentials.polymarketAddress | quote }}
  POLYMARKET_API_KEY:          {{ .Values.credentials.polymarketApiKey | quote }}
  POLYMARKET_API_SECRET:       {{ .Values.credentials.polymarketApiSecret | quote }}
  POLYMARKET_API_PASSPHRASE:   {{ .Values.credentials.polymarketApiPassphrase | quote }}
  POLYMARKET_SIGNATURE_TYPE:   {{ .Values.credentials.polymarketSignatureType | quote }}
  POLYMARKET_FUNDER:           {{ .Values.credentials.polymarketFunder | quote }}
  # Bot behaviour
  APP_LOG_LEVEL:      {{ .Values.bot.appLogLevel | quote }}
  DRY_RUN:            {{ .Values.bot.dryRun | quote }}
  LOOP_INTERVAL_SECS: {{ .Values.bot.loopIntervalSecs | quote }}
  COIN:               {{ .Values.bot.coin | default "btc" | quote }}
  # Paper mode / maker-rebate quoting
  PAPER_MODE:            {{ .Values.bot.paperMode | default "true" | quote }}
  # LIVE trading (maker_rebate real-order path) — all gates must align:
  # LIVE_TRADING=true AND PAPER_MODE=false AND DRY_RUN=false AND creds present.
  LIVE_TRADING:            {{ .Values.bot.liveTrading | default "false" | quote }}
  LIVE_MAX_ORDER_USD:      {{ .Values.bot.liveMaxOrderUsd | default "5" | quote }}
  LIVE_MAX_DAILY_LOSS_USD: {{ .Values.bot.liveMaxDailyLossUsd | default "25" | quote }}
  LIVE_QUOTE_WARMUP_SECS:  {{ .Values.bot.liveQuoteWarmupSecs | default "0" | quote }}
  PREDISCOVERY_LEAD_SECS:  {{ .Values.bot.prediscoveryLeadSecs | default "30" | quote }}
  LIVE_RECONCILE_SECS:     {{ .Values.bot.liveReconcileSecs | default "30" | quote }}
  QUOTE_NOTIONAL_USD:      {{ .Values.bot.quoteNotionalUsd | default "5.0" | quote }}
  QUOTE_MODE:            {{ .Values.bot.quoteMode | default "bracket" | quote }}
  QUOTE_SIDE:            {{ .Values.bot.quoteSide | default "cheaper" | quote }}
  ENTRY_PRICE_CAP:       {{ .Values.bot.entryPriceCap | default "0.50" | quote }}
  TAKE_PROFIT_PRICE:     {{ .Values.bot.takeProfitPrice | default "0.99" | quote }}
  STOP_LOSS_PRICE:       {{ .Values.bot.stopLossPrice | default "0.10" | quote }}
  MAX_FILLS_PER_BAR:     {{ .Values.bot.maxFillsPerBar | default "1" | quote }}
  QUOTE_HALF_SPREAD:     {{ .Values.bot.quoteHalfSpread | default "0.02" | quote }}
  QUOTE_FLOOR:           {{ .Values.bot.quoteFloor | default "0.30" | quote }}
  ENTRY_STYLE:           {{ .Values.bot.entryStyle | default "fixed" | quote }}
  BRACKET_SIDES:         {{ .Values.bot.bracketSides | default "one" | quote }}
  BRACKET_SIDE_RULE:     {{ .Values.bot.bracketSideRule | default "alternate" | quote }}
  QUOTE_CEIL:            {{ .Values.bot.quoteCeil | default "0.70" | quote }}
  QUOTE_SIZE:            {{ .Values.bot.quoteSize | default "10" | quote }}
  QUOTE_CUTOFF_SECS:     {{ .Values.bot.quoteCutoffSecs | default "60" | quote }}
  QUOTE_WARMUP_SECS:     {{ .Values.bot.quoteWarmupSecs | default "10" | quote }}
  MIN_PAIR_EDGE:         {{ .Values.bot.minPairEdge | default "0.01" | quote }}
  QUOTE_MODEL_MARGIN:    {{ .Values.bot.quoteModelMargin | default "0.04" | quote }}
  LOCK_MOM_BRAKE_Z:      {{ .Values.bot.lockMomBrakeZ | default "1.3" | quote }}
  LOCK_ASYM_MOM_Z:       {{ .Values.bot.lockAsymMomZ | default "0.7" | quote }}
  LOCK_ASYM_EXTRA:       {{ .Values.bot.lockAsymExtra | default "0.04" | quote }}
  LOCK_COMPLETION_MARGIN: {{ .Values.bot.lockCompletionMargin | default "0.01" | quote }}
  LOCK_PAIR_TARGET:      {{ .Values.bot.lockPairTarget | default "0.96" | quote }}
  REPRICE_TICKS:         {{ .Values.bot.repriceTicks | default "0.01" | quote }}
  REPRICE_Z:             {{ .Values.bot.repriceZ | default "1.5" | quote }}
  MAX_INVENTORY_SHARES:  {{ .Values.bot.maxInventoryShares | default "50" | quote }}
  MAKER_FEE_RATE:        {{ .Values.bot.makerFeeRate | default "0.07" | quote }}
  PAPER_TRADE_FEED_TIMEOUT_SECS: {{ .Values.bot.paperTradeFeedTimeoutSecs | default "600" | quote }}
  BET_SIZE_MIN:       {{ .Values.bot.betSizeMin | quote }}
  BET_SIZE_MAX:       {{ .Values.bot.betSizeMax | quote }}
  MAX_BUDGET_FRACTION: {{ .Values.bot.maxBudgetFraction | default "0.10" | quote }}
  # Signal parameters
  MIN_EDGE:           {{ .Values.bot.minEdge | quote }}
  KELLY_SCALE:        {{ .Values.bot.kellyScale | quote }}
  ENTRY_MIN_SECONDS_LEFT: {{ .Values.bot.entryMinSecondsLeft | quote }}
  MAX_ENTRY_SPREAD:   {{ .Values.bot.maxEntrySpread | quote }}
  MIN_ENTRY_PRICE:    {{ .Values.bot.minEntryPrice | default "0.15" | quote }}
  MAX_ENTRY_PRICE:    {{ .Values.bot.maxEntryPrice | default "0.40" | quote }}
  # fav_taker (near-locked-favorite taker) decision gates
  CUR2_DEBIAS:         {{ .Values.bot.cur2Debias | default "true" | quote }}
  CUR2_MIN_CONVICTION: {{ .Values.bot.cur2MinConviction | default "0.02" | quote }}
  CUR2_CENTER_WINDOW:  {{ .Values.bot.cur2CenterWindow | default "288" | quote }}
  FAV_MIN_PRICE:      {{ .Values.bot.favMinPrice | default "0.80" | quote }}
  FAV_MAX_PRICE:      {{ .Values.bot.favMaxPrice | default "0.97" | quote }}
  FAV_MIN_TRUE:       {{ .Values.bot.favMinTrue | default "0.90" | quote }}
  FAV_MIN_EDGE:       {{ .Values.bot.favMinEdge | default "0.03" | quote }}
  FAV_MIN_TLEFT:      {{ .Values.bot.favMinTleft | default "15" | quote }}
  FAV_MAX_TLEFT:      {{ .Values.bot.favMaxTleft | default "180" | quote }}
  FAV_TAKER_FEE_RATE: {{ .Values.bot.favTakerFeeRate | default "0.10" | quote }}
  FAV_MIN_LEAD_BPS:   {{ .Values.bot.favMinLeadBps | default "4" | quote }}
  FAV_POCKETS:        {{ .Values.bot.favPockets | default "" | quote }}
  # ws_recorder.py — full-state snapshot recorder (in-bot via RECORD_SNAPSHOTS)
  RECORD_SNAPSHOTS:   {{ .Values.bot.recordSnapshots | default "false" | quote }}
  SNAPSHOT_MS:        {{ .Values.bot.snapshotMs | default "100" | quote }}
  RAW_LOG_DIR:        {{ .Values.bot.rawLogDir | default "/app/logs/raw" | quote }}
  RETENTION_DAYS:     {{ .Values.bot.retentionDays | default "7" | quote }}
  MODEL_PROB_FLOOR:   {{ .Values.bot.modelProbFloor | quote }}
  MODEL_PROB_CEIL:    {{ .Values.bot.modelProbCeil | quote }}
  STRATEGY_NAME:      {{ .Values.bot.strategyName | default "latency_arb_hold" | quote }}
  ML_BLEND_WEIGHT:    {{ .Values.bot.mlBlendWeight | default "0.50" | quote }}
  MIN_POSITION_SHARES: {{ .Values.bot.minPositionShares | quote }}
  ENTRY_CONFIRMATION_TICKS: {{ .Values.bot.entryConfirmationTicks | quote }}
  FILTER_CONTRARIAN_ENTRIES: {{ .Values.bot.filterContrarianEntries | default "false" | quote }}
  CONTRARIAN_TAIL_MAX_PRICE: {{ .Values.bot.contrarianTailMaxPrice | default "0.25" | quote }}
  CONTRARIAN_MOVE_FILTER: {{ .Values.bot.contrarianMoveFilter | default "0.0015" | quote }}
  MIN_BTC_DISTANCE:   {{ .Values.bot.minBtcDistance | default "0.0004" | quote }}
  MIN_BOOK_DIVERGENCE: {{ .Values.bot.minBookDivergence | default "0.04" | quote }}
  LATE_ENTRY_SECS:    {{ .Values.bot.lateEntrySecs | default "90" | quote }}
  LATE_ENTRY_EDGE_DISCOUNT: {{ .Values.bot.lateEntryEdgeDiscount | default "0.30" | quote }}
  DRIFT_A3:           {{ .Values.bot.driftA3 | quote }}
  WS_HEARTBEAT_SECS:  {{ .Values.bot.wsHeartbeatSecs | quote }}
  FEED_STALE_SECS:    {{ .Values.bot.feedStaleSecs | quote }}
  # Position management
  EVAL_INTERVAL_MS: {{ .Values.bot.evalIntervalMs | quote }}
  ENTRY_MAKER_OFFSET: {{ .Values.bot.entryMakerOffset | default "0.0" | quote }}
  TAKE_PROFIT:        {{ .Values.bot.takeProfit | quote }}
  STOP_LOSS:          {{ .Values.bot.stopLoss | quote }}
  STOP_LOSS_MARKET_LIMIT: {{ .Values.bot.stopLossMarketLimit | default "1" | quote }}
  BLOCK_REENTRY_IF_BID_DROP_GT: {{ .Values.bot.blockReentryIfBidDropGt | default "0" | quote }}
  BLOCK_REENTRY_AFTER_REASONS: {{ .Values.bot.blockReentryAfterReasons | default "" | quote }}
  BLOCK_GLOBAL_AFTER_REASONS_SECS: {{ .Values.bot.blockGlobalAfterReasonsSecs | default "0" | quote }}
  SL_ARM_DELAY_SECS:    {{ .Values.bot.slArmDelaySecs | default "60" | quote }}
  ULTRA_CHEAP_SL_DELAY_SECS: {{ .Values.bot.ultraCheapSlDelaySecs | default "120" | quote }}
  SL_MIN_ADVERSE_BTC:   {{ .Values.bot.slMinAdverseBtc | default "0.0015" | quote }}
  THESIS_MIN_BTC_DISTANCE: {{ .Values.bot.thesisMinBtcDistance | default "0.002" | quote }}
  MIN_EXIT_BID:       {{ .Values.bot.minExitBid | quote }}
  ORDER_REPLACE_GAP:  {{ .Values.bot.orderReplaceGap | quote }}
  AGGRESSIVE_EXIT_SLIPPAGE: {{ .Values.bot.aggressiveExitSlippage | default "0.02" | quote }}
  ENTRY_SLIPPAGE_CAP: {{ .Values.bot.entrySlippageCap | default "0.06" | quote }}
  TRAILING_ARM_GAIN: {{ .Values.bot.trailingArmGain | default "0.20" | quote }}
  TRAILING_STOP_GAP: {{ .Values.bot.trailingStopGap | default "0.03" | quote }}
  # math_smart strategy knobs (all optional; defaults fall back to code defaults when unset)
  # Phase 1 velocity-aware salvage (env-gated, off by default)
  # Phase 4 entry-quality gates (env-gated, off by default)
  # math_smart_v2 basis knobs
  # Binance feed + hold-to-expiry
  # empty BINANCE_WS_URL → config.py derives the stream from COIN
  BINANCE_WS_URL:     {{ .Values.bot.binanceWsUrl | default "" | quote }}
  BINANCE_STALE_SECS: {{ .Values.bot.binanceStaleSecs | default "5.0" | quote }}
  PRICE_LEAD_SOURCE:  {{ .Values.bot.priceLeadSource | default "binance" | quote }}
  # Fast execution (execution/ package): event-driven eval + prewarm/presign
  FAST_EXEC:          {{ .Values.bot.fastExec | default "true" | quote }}
  LOCK_MAX_UNMATCHED: {{ .Values.bot.lockMaxUnmatched | default "10" | quote }}
  QUOTE_FIXED_PRICE:  {{ .Values.bot.quoteFixedPrice | default "0.20" | quote }}
  FAV_ORDER_TYPE:     {{ .Values.bot.favOrderType | default "fak" | quote }}
  BAR_SECONDS:        {{ .Values.bot.barSeconds | default "300" | quote }}
  EVAL_MIN_GAP_MS:    {{ .Values.bot.evalMinGapMs | default "50" | quote }}
  CLOB_KEEPALIVE_SECS: {{ .Values.bot.clobKeepaliveSecs | default "25" | quote }}
  HOLD_TO_EXPIRY_DEFAULT: {{ .Values.bot.holdToExpiryDefault | default "true" | quote }}
  TAKER_FEE_BPS:      {{ .Values.bot.takerFeeBps | default "0" | quote }}
  # Infrastructure
  POLYGON_RPC_URL:    {{ .Values.bot.polygonRpcUrl | default "https://rpc.ankr.com/polygon" | quote }}
  POLYMARKET_RTDS_WS: {{ .Values.bot.polymarketRtdsWs | quote }}
  POLYMARKET_RTDS_SYMBOL: {{ .Values.bot.polymarketRtdsSymbol | quote }}
  # Training logs
  TRAINING_LOG_PATH:       {{ .Values.bot.trainingLogPath | default "/app/logs/logs-training.jsonl" | quote }}
  TRAINING_EVENT_LOG_PATH: {{ .Values.bot.trainingEventLogPath | default "/app/logs/logs-training-events.jsonl" | quote }}
  # Telegram
  TELEGRAM_TOKEN:   {{ .Values.telegram.token | quote }}
  TELEGRAM_CHAT_ID: {{ .Values.telegram.chatId | quote }}
