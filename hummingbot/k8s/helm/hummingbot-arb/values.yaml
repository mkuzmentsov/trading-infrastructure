botName: hummingbot-arb

image:
  repository: mkuzmentsov/hummingbot-wb
  tag: "0.1"
  pullPolicy: IfNotPresent

# Arbitrage strategy parameters
arbitrage:
  # Trading pairs: hl is the Hyperliquid perpetual pair, wb is the WhiteBIT spot pair
  tradingPairs:
    - hl: "BTC-USDC"
      wb: "BTC_USDT"
      # Amount in base asset per order
      orderAmount: "0.001"
    - hl: "ETH-USDC"
      wb: "ETH_USDT"
      orderAmount: "0.01"

  # Minimum net profitability threshold (after fees) to trigger a trade
  minProfitability: "0.002"  # 0.2%

  # Exchange taker fees
  hlFeePct: "0.00035"   # Hyperliquid: 0.035%
  wbFeePct:  "0.001"    # WhiteBIT:    0.10%

  # Tick interval in seconds (how often to check for opportunities)
  tickInterval: 5

# Exchange credentials — leave empty here, set in per-bot values file (gitignored)
hyperliquid:
  walletAddress: ""
  privateKey: ""

whitebit:
  apiKey: ""
  secretKey: ""

# Telegram notifications
telegram:
  enabled: false
  token: ""
  chatId: ""

# Hummingbot REST API (status endpoint)
api:
  enabled: true
  user: hummingbot
  password: ""

# Ingress for the Hummingbot API
ingress:
  enabled: false
  className: nginx
  host: ""
  tls:
    enabled: false
    secretName: ""

# Persistence for logs and SQLite state
persistence:
  enabled: true
  size: 2Gi
  storageClass: ""

resources:
  requests:
    memory: 512Mi
    cpu: 200m
  limits:
    memory: 1Gi
    cpu: 500m
