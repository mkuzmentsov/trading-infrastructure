{{- if .Values.api.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "hummingbot-arb.name" . }}
  labels:
    {{- include "hummingbot-arb.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "hummingbot-arb.selectorLabels" . | nindent 4 }}
  ports:
    - name: api
      port: 8080
      targetPort: api
      protocol: TCP
{{- end }}
