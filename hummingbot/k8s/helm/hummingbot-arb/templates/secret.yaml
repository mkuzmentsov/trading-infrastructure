apiVersion: v1
kind: Secret
metadata:
  name: {{ include "hummingbot-arb.name" . }}-credentials
  labels:
    {{- include "hummingbot-arb.labels" . | nindent 4 }}
type: Opaque
stringData:
  hl_wallet_address: {{ .Values.hyperliquid.walletAddress | quote }}
  hl_private_key: {{ .Values.hyperliquid.privateKey | quote }}
  wb_api_key: {{ .Values.whitebit.apiKey | quote }}
  wb_secret_key: {{ .Values.whitebit.secretKey | quote }}
  telegram_token: {{ .Values.telegram.token | quote }}
  telegram_chat_id: {{ .Values.telegram.chatId | quote }}

  # Script config YAML — inlined here so it travels with credentials
  script_config_yml: |
    hl_connector: hyperliquid_perpetual
    wb_connector: whitebit

    trading_pairs:
    {{- range .Values.arbitrage.tradingPairs }}
      - hl: {{ .hl | quote }}
        wb: {{ .wb | quote }}
        order_amount: {{ .orderAmount | quote }}
    {{- end }}

    min_profitability: {{ .Values.arbitrage.minProfitability | quote }}
    open_basis_threshold: "0.003"
    close_basis_threshold: "0.0005"
    min_funding_rate: "0.0001"

    hl_fee_pct: {{ .Values.arbitrage.hlFeePct | quote }}
    wb_fee_pct: {{ .Values.arbitrage.wbFeePct | quote }}

    {{- if .Values.telegram.enabled }}
    telegram:
      enabled: true
      token: {{ .Values.telegram.token | quote }}
      chat_id: {{ .Values.telegram.chatId | quote }}
    {{- end }}
