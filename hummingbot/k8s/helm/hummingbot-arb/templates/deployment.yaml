apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "hummingbot-arb.name" . }}
  labels:
    {{- include "hummingbot-arb.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "hummingbot-arb.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "hummingbot-arb.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        checksum/script: {{ include (print $.Template.BasePath "/configmap-script.yaml") . | sha256sum }}
    spec:
      containers:
        - name: hummingbot
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            # Exchange credentials injected from Secret
            - name: HL_WALLET_ADDRESS
              valueFrom:
                secretKeyRef:
                  name: {{ include "hummingbot-arb.name" . }}-credentials
                  key: hl_wallet_address
            - name: HL_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "hummingbot-arb.name" . }}-credentials
                  key: hl_private_key
            - name: WB_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "hummingbot-arb.name" . }}-credentials
                  key: wb_api_key
            - name: WB_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "hummingbot-arb.name" . }}-credentials
                  key: wb_secret_key
            {{- if .Values.telegram.enabled }}
            - name: TELEGRAM_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "hummingbot-arb.name" . }}-credentials
                  key: telegram_token
            - name: TELEGRAM_CHAT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "hummingbot-arb.name" . }}-credentials
                  key: telegram_chat_id
            {{- end }}
          ports:
            - name: api
              containerPort: 8080
              protocol: TCP
          volumeMounts:
            # Persistent storage for logs and SQLite state
            - name: hummingbot-data
              mountPath: /home/hummingbot/data
            - name: hummingbot-logs
              mountPath: /home/hummingbot/logs
            # Strategy script from ConfigMap
            - name: script
              mountPath: /home/hummingbot/scripts/hl_wb_arb.py
              subPath: hl_wb_arb.py
            # Script config (pairs, thresholds) from Secret
            - name: script-config
              mountPath: /home/hummingbot/conf/scripts/hl_wb_arb.yml
              subPath: hl_wb_arb.yml
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: hummingbot-data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "hummingbot-arb.name" . }}-pvc
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: hummingbot-logs
          emptyDir: {}
        - name: script
          configMap:
            name: {{ include "hummingbot-arb.name" . }}-script
        - name: script-config
          secret:
            secretName: {{ include "hummingbot-arb.name" . }}-credentials
            items:
              - key: script_config_yml
                path: hl_wb_arb.yml
